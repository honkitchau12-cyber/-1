*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}button,input,select{font:inherit;color:inherit}button,a,summary,select{touch-action:manipulation}button,select,summary{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bb8b3f;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button{background:none;border:0}.wrap{width:min(1020px,calc(100% - 56px));margin:auto}[hidden]{display:none!important}

.navgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 18px}.law{display:flex;align-items:center;justify-content:space-between;gap:5px;text-align:left;border:1px solid var(--border);border-radius:7px;background:#fff;padding:13px 16px;font-weight:650;min-height:56px}.law .number,.mini,.count,.pos{font-variant-numeric:tabular-nums}.law .number{font-size:.8rem;color:var(--dim);font-weight:500}.law[aria-pressed=true]{background:#dfebe3;color:#154c3a;border-color:#65947b;box-shadow:inset 3px 0 var(--teal)}.law[aria-pressed=true] .number{color:var(--teal)}.law:hover,.chip:hover,.outline:hover,summary:hover{border-color:#749985}
.panel{background:#fff;border:1px solid var(--border);border-radius:9px;padding:13px 16px;display:grid;gap:11px}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.line.find{display:grid;grid-template-columns:minmax(160px,1.65fr) minmax(120px,1fr)}input,select{width:100%;min-width:0;font-size:14px;border:1px solid var(--border);background:#fbfcf9;border-radius:5px;padding:9px 12px;line-height:1.45}input::placeholder{color:#697971}.chip,.outline,.plain,.primary,.linkbtn{font-size:14px;line-height:1.45;font-weight:550}.chip{border-radius:5px;padding:5px 10px;color:var(--dim);border:1px solid transparent}.chip[aria-pressed=true]{color:var(--teal);background:#e3eee6;border-color:#c7dbcc}.vline{width:1px;height:18px;background:var(--border);margin:0 2px}.core[aria-pressed=true]{color:#704b15;background:#fff2ce;border-color:#e1c88e}.outline,.primary,.plain{border-radius:5px;padding:9px 14px}.outline{border:1px solid var(--border);background:#fff}.primary{color:#fff;background:var(--teal);border:1px solid var(--teal)}.primary:hover{background:#114b3c}.plain{color:var(--dim)}.session{margin-left:auto}
.resulthead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0 10px}.resulthead h2{font:700 23px/1.4 var(--serif);margin:0}.count{color:var(--dim);font-size:13px}.resulthead .linkbtn{font-size:13px}.linkbtn{text-decoration:underline;text-underline-offset:4px;color:var(--teal);padding:3px 0}
.cards{display:grid;gap:12px}.card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:18px 22px 15px;min-width:0}.meta{color:var(--dim);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ref{font-weight:650;color:var(--teal)}.card[data-law=C] .ref{color:#805e29}.card[data-law=N] .ref{color:#865141}.coremark{color:#855c1c}.mini{margin-left:auto;font-size:.75rem;color:#69786e}.question{font-size:clamp(17px,2.1vw,21px);font-weight:650;line-height:1.6;margin:9px 0 12px;white-space:pre-line}.negword{color:var(--rust);text-decoration:underline;text-underline-offset:3px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 10px}.option{display:flex;align-items:baseline;gap:9px;border:1px solid #e1e5df;border-radius:5px;background:#fbfcfa;padding:8px 12px;text-align:left;line-height:1.5;font-size:15px}.key{color:#64756c;font:600 .83em/1.5 ui-monospace,monospace}.option:hover{border-color:#799c87}.answer,.reading{display:none}.revealed .answer{display:block}.answer{background:#eff5ef;border-left:3px solid #518066;border-radius:0 5px 5px 0;padding:10px 14px;margin:10px 0;overflow-wrap:anywhere}.answer strong{color:#20523b}.answer p{margin:3px 0;font-size:14px}.answer details{margin-top:6px}.answer summary{font-size:13px;color:var(--teal);width:fit-content}.answer .passage{font-size:14px;margin:.7em 0;line-height:1.8}.revealed .right{border-color:#6e9776;background:#e6f1e7}.revealed .picked:not(.right){border-color:#bc8979;background:#fbf0eb}.reply{font-size:13px;color:var(--teal);font-weight:600}.cardfoot{display:flex;align-items:center;gap:15px}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin:25px 0 32px}.empty{background:#fff;border:1px dashed var(--border);padding:36px;text-align:center;border-radius:7px}.sources{margin:20px 0 45px;border-top:1px solid var(--border);padding-top:12px;color:var(--dim);font-size:13px}.sources p{margin:7px 0}.sources a{margin-right:14px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
dialog{position:fixed;inset:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;border:0;background:var(--paper);color:var(--ink);padding:0}dialog[open]{display:grid;grid-template-rows:auto 1fr auto}.stageTop,.stageBottom{padding:12px max(20px,calc((100vw - 1020px)/2));display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stageTop{background:var(--dark);color:white}.stageTop strong{font-family:var(--serif);font-size:20px}.pos{margin-right:auto;color:#dce9db}.timer{font:700 29px ui-monospace,monospace}.timer.hot{color:#f8c383}.stageClose{color:white;text-decoration:underline;font-size:14px}.stageMiddle{overflow:auto;display:flex;padding:20px 0}.stageCard{width:min(960px,calc(100% - 40px));margin:auto}.stageCard .question{font:700 clamp(23px,3.7vw,40px)/1.48 var(--serif)}.stageCard .option{font-size:clamp(16px,2.3vw,24px);padding:11px 14px}.stageCard .answer{font-size:19px}.stageCard .answer p{font-size:clamp(16px,1.8vw,20px)}.stageBottom{border-top:1px solid var(--border);background:#fff;justify-content:center}.stageMiddle .meta{font-size:14px}
@media(max-width:700px){.wrap{width:calc(100% - 28px)}.mast{padding:11px 0}.hero{padding:23px 0}.navgrid{grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 10px}.law{min-height:42px;padding:8px 11px}.panel,.card{padding:12px}.line.find{grid-template-columns:1fr}.chip{padding:5px 7px}.line{gap:4px}.opts{grid-template-columns:1fr}.session{padding:7px 10px}.stageTop,.stageBottom{gap:8px;padding:10px 12px}.stageCard{width:calc(100% - 26px)}.stageBottom button{padding:8px 10px}.stageMiddle .meta{font-size:12px}.answer{padding:9px}.resulthead{margin:16px 0 9px}.resulthead h2{font-size:20px}.hero p{font-size:13px}}

#drawMode:hover{background:#ffe6aa}

#drawSetup[open]{display:block}#drawSetup::backdrop{background:#0e2826a8}

<body>
<header><div class="wrap"><div class="mast"><span class="brand"><i class="book" aria-hidden="true"></i>中學問答比賽練習</span><a id="save" class="download" href="./index.html" download="index.html">下載離線版 ↓</a></div><div class="hero"><h1>三法搶答題庫</h1><p>基本法、憲法及香港國安法　<span aria-hidden="true">／</span>　條文重點練習</p><button id="drawMode" type="button" aria-haspopup="dialog">抽題模式 <span aria-hidden="true">→</span></button></div></div></header>
<main class="wrap">
<nav class="navgrid" id="laws" aria-label="選擇法律"></nav>
<section class="panel" aria-label="篩選題庫"><div class="line find">
<input type="search" id="search" aria-label="搜尋題目、答案或條號" placeholder="搜尋題目、答案或條號，例如「解釋權」、「第23條」">
<select id="chapter" aria-label="選擇章節"></select></div>
<div class="line" id="types"><button class="chip" data-type="all">全部題型</button><button class="chip" data-type="mc">選擇題</button><button class="chip" data-type="sa">簡答題</button><span class="vline"></span><button id="negative" class="chip">否定題</button><button id="core" class="chip core">賽前精選</button><button class="primary session" id="start" aria-haspopup="dialog">從篩選結果抽題 <span aria-hidden="true">↗</span></button></div></section>
<div class="resulthead"><div><h2 id="heading">全部題目</h2><span class="count" id="result" aria-live="polite"></span></div><button id="revealAll" class="linkbtn">顯示全部答案</button></div>
<div class="cards" id="list"></div><nav class="pager" id="pager" aria-label="題目分頁"><button class="outline" id="prev">上一頁</button><span class="count" id="page"></span><button class="outline" id="next">下一頁</button></nav>
<details class="sources"><summary>出題範圍及條文來源</summary><p>按三份附件的全部正文章節選題，兼及序言和《基本法》附件重點。相近規定合併考問。按「賽前精選」可集中練習憲制原則、機關職權、權利保障及國安罪行等核心概念。題目為自擬練習。</p><p><a href="https://www.basiclaw.gov.hk/tc/basiclaw/" target="_blank" rel="noopener">《基本法》全文 ↗</a><a href="https://www.basiclaw.gov.hk/tc/constitution/" target="_blank" rel="noopener">《憲法》全文 ↗</a><a href="https://www.gld.gov.hk/egazette/pdf/20202444e/cs220202444136.pdf" target="_blank" rel="noopener">《香港國安法》憲報文本 ↗</a></p></details>
</main>
<dialog id="drawSetup" aria-labelledby="drawTitle">
<form id="drawForm"><h2 id="drawTitle">抽題模式</h2>
<p id="drawCompleted" role="status" hidden></p>
<div class="drawFields">
<label class="drawScope">抽題範圍<select id="drawPool"><option value="all">全部題庫</option><option value="core">賽前精選</option><option value="filtered">目前篩選結果</option></select></label>
<label>法律<select id="drawLaw"><option value="all">全部法律</option><option value="B">基本法</option><option value="C">憲法</option><option value="N">香港國安法</option></select></label>
<label>題型<select id="drawType"><option value="all">混合題型</option><option value="mc">選擇題</option><option value="sa">簡答題</option></select></label>
<label class="drawScope">本輪題數<input type="number" inputmode="numeric" id="drawCount" value="10" min="1" step="1" required aria-describedby="drawInfo"></label></div>
<p id="drawInfo" aria-live="polite"></p><div class="drawActions"><button type="button" class="outline" id="drawCancel">返回題庫</button><button type="submit" class="primary" id="drawGo">開始抽題</button></div></form></dialog>

<script type="application/json" id="bank">[{"art":"序言","type":"mc","q":"國家根據《憲法》哪一條設立香港特別行政區？","ev":"《基本法》序言引述《憲法》第三十一條，說明設立特別行政區的憲制依據。","chapter":"序言","core":true,"opts":["第三十一條","第二十三條","第四十五條","第一百五十八條"],"ci":0,"additional":[{"title":"序言","body":"香港自古以來就是中國的領土，一八四○年鴉片戰爭以後被英國佔領。一九八四年十二月十九日，中英兩國政府簽署了關於香港問題的聯合聲明，確認中華人民共和國政府於一九九七年七月一日恢復對香港行使主權，從而實現了長期以來中國人民收回香港的共同願望。為了維護國家的統一和領土完整，保持香港的繁榮和穩定，並考慮到香港的歷史和現實情況，國家決定，在對香港恢復行使主權時，根據中華人民共和國憲法第三十一條的規定，設立香港特別行政區，並按照“一個國家，兩種制度”的方針，不在香港實行社會主義的制度和政策。國家對香港的基本方針政策，已由中國政府在中英聯合聲明中予以闡明。根據中華人民共和國憲法，全國人民代表大會特制定中華人民共和國香港特別行政區基本法，規定香港特別行政區實行的制度，以保障國家對香港的基本方針政策的實施。"}],"refs":[],"law":"B","negative":false,"id":1},{"art":"序言","type":"mc","q":"哪個國家機關制定《香港基本法》？","ev":"全國人民代表大會根據《憲法》制定《基本法》，規定香港實行的制度。","chapter":"序言","core":false,"opts":["國務院","全國政協","全國人大常委會","全國人民代表大會"],"ci":3,"additional":[{"title":"序言","body":"香港自古以來就是中國的領土，一八四○年鴉片戰爭以後被英國佔領。一九八四年十二月十九日，中英兩國政府簽署了關於香港問題的聯合聲明，確認中華人民共和國政府於一九九七年七月一日恢復對香港行使主權，從而實現了長期以來中國人民收回香港的共同願望。為了維護國家的統一和領土完整，保持香港的繁榮和穩定，並考慮到香港的歷史和現實情況，國家決定，在對香港恢復行使主權時，根據中華人民共和國憲法第三十一條的規定，設立香港特別行政區，並按照“一個國家，兩種制度”的方針，不在香港實行社會主義的制度和政策。國家對香港的基本方針政策，已由中國政府在中英聯合聲明中予以闡明。根據中華人民共和國憲法，全國人民代表大會特制定中華人民共和國香港特別行政區基本法，規定香港特別行政區實行的制度，以保障國家對香港的基本方針政策的實施。"}],"refs":[],"law":"B","negative":false,"id":2},{"art":"主席令第二十六號、序言","type":"sa","q":"《香港基本法》在哪一天通過？又在哪一天開始實施？","ev":"全國人大通過《基本法》與香港特別行政區成立、法律生效，是兩個不同日期。","chapter":"序言","core":true,"ans":"1990年4月4日通過，1997年7月1日實施。","additional":[{"title":"主席令第二十六號（節錄）","body":"已由中華人民共和國第七屆全國人民代表大會第三次會議於1990年4月4日通過，現予公布，自1997年7月1日起實施。"}],"refs":[],"law":"B","negative":false,"id":3},{"art":"第一、二條","type":"mc","q":"香港是中華人民共和國不可分離的部分。哪個機關授權香港依《基本法》實行高度自治？","ev":"香港的高度自治權來自全國人大授權，權力範圍由《基本法》規定。","chapter":"第一章　總則","core":true,"opts":["全國人民代表大會","國務院","中央軍事委員會","香港立法會"],"ci":0,"refs":[1,2],"law":"B","negative":false,"id":4},{"art":"第二條","type":"mc","q":"以下哪一項不屬於第二條授予香港特別行政區的權力？","ev":"第二條列出行政、立法及司法方面的權力。防務由中央人民政府管理。","chapter":"第一章　總則","core":false,"opts":["獨立的司法權和終審權","立法權","行政管理權","國防決策權"],"ci":3,"refs":[2],"law":"B","negative":true,"id":5},{"art":"第三條","type":"mc","q":"香港特區的行政機關和立法機關由哪一類居民依《基本法》組成？","ev":"第三條訂明成員須為香港永久性居民。不同職位另有特定資格要求。","chapter":"第一章　總則","core":false,"opts":["香港永久性居民","只限在香港出生的居民","所有在香港通常居住的人","只限沒有外國居留權的居民"],"ci":0,"refs":[3],"law":"B","negative":false,"id":6},{"art":"第五條","type":"sa","q":"《基本法》規定香港哪兩方面保持五十年不變？","ev":"第五條以制度和生活方式說明「一國兩制」在香港的安排。","chapter":"第一章　總則","core":true,"ans":"原有的資本主義制度和生活方式。","refs":[5],"law":"B","negative":false,"id":7},{"art":"第七條","type":"mc","q":"香港的土地和自然資源屬誰所有？其收入由誰支配？","ev":"土地和自然資源的所有權屬國家，特區政府負責管理，收入全歸特區政府支配。","chapter":"第一章　總則","core":true,"opts":["國家所有，由中央人民政府支配收入","國家所有，由特區政府支配收入","特區政府所有，由中央人民政府支配收入","特區政府所有，由特區政府支配收入"],"ci":1,"refs":[7],"law":"B","negative":false,"id":8},{"art":"第八、十一條","type":"mc","q":"對香港原有的普通法和衡平法，《基本法》如何處理？","ev":"第八條保留原有法律並訂明例外。特區立法機關制定的法律亦不得與《基本法》抵觸。","chapter":"第一章　總則","core":false,"opts":["原則上保留，與《基本法》抵觸或經特區立法機關修改者除外","一律改用內地法律","全部保留，特區立法機關無權修改","必須逐項由全國人大重新制定"],"ci":0,"refs":[8,11],"law":"B","negative":false,"id":9},{"art":"第九條","type":"sa","q":"特區行政、立法和司法機關除使用中文外，還可使用哪一種正式語文？","ev":"第九條明定英文也是正式語文，適用於上述三類機關。","chapter":"第一章　總則","core":false,"ans":"英文。","refs":[9],"law":"B","negative":false,"id":10},{"art":"第十條","type":"mc","q":"《基本法》怎樣描述香港特區區旗的圖案？","ev":"記清花種、花蕊和旗色，三者均屬第十條的描述。","chapter":"第一章　總則","core":false,"opts":["白底配紅色紫荊花的旗","五顆金星環繞紫荊花的紅旗","五星花蕊的蓮花紅旗","五星花蕊的紫荊花紅旗"],"ci":3,"refs":[10],"law":"B","negative":false,"id":11},{"art":"第十二條","type":"mc","q":"香港特別行政區直轄於哪個機關？","ev":"香港是享有高度自治權的地方行政區域，直轄於中央人民政府。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"opts":["中央人民政府","全國政協","廣東省人民政府","外交部"],"ci":0,"refs":[12],"law":"B","negative":false,"id":12},{"art":"第十三條","type":"mc","q":"哪一項正確說明「外交事務」和「對外事務」的分工？","ev":"中央人民政府管理外交事務，並授權特區依《基本法》處理有關對外事務。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"opts":["特區管理外交事務，中央管理一切經貿往來","中央只管理國防，外交完全由特區管理","中央管理有關香港的外交事務，特區獲授權自行處理有關對外事務","立法會可自行決定與外國建立外交關係"],"ci":2,"refs":[13],"law":"B","negative":false,"id":13},{"art":"第十四條","type":"sa","q":"香港的防務和社會治安，分別由誰負責？","ev":"駐軍負責防務。特區政府在必要時可向中央人民政府請求駐軍協助維持社會治安和救災。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"ans":"中央人民政府負責防務，香港特區政府負責維持社會治安。","refs":[14],"law":"B","negative":false,"id":14},{"art":"第十五、四十八條","type":"mc","q":"任命香港特區主要官員的程序是哪一項？","ev":"提名是行政長官的職權，任命權屬中央人民政府。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["行政會議提名並由行政長官任命","行政長官提名並由全國人大常委會任命","立法會提名並由行政長官任命","行政長官提名並報請中央人民政府任命"],"ci":3,"refs":[15,48],"law":"B","negative":false,"id":15},{"art":"第十六條、第六十五條","chapter":"第二章　中央和香港特別行政區的關係","q":"哪一項安排體現特區自行處理行政事務的權力，也符合《基本法》對諮詢組織的規定？","ev":"第十六條訂明行政管理權，第六十五條保留原有的諮詢組織制度。諮詢組織提供意見，行政機關負責處理行政事務。","core":false,"type":"mc","opts":["把本地行政事務交由全國人大常委會辦理。","授權諮詢組織制定法例，以取代立法會的立法程序。","特區自行處理本地行政事務，保留行政機關設立諮詢組織的制度。","諮詢組織作出行政決定後，由法院負責執行。"],"ci":2,"refs":[16,65],"law":"B","negative":false,"id":16},{"art":"第十七條","type":"sa","q":"香港立法機關制定的法律須報哪個機關備案？備案會否影響其生效？","ev":"第十七條採用備案制度。法例無須先獲該機關批准才生效。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"ans":"報全國人大常委會備案，備案不影響生效。","refs":[17],"law":"B","negative":false,"id":17},{"art":"第十七條","type":"mc","q":"全國人大常委會按第十七條徵詢意見後，認為本地法律不符合有關中央事務或中央與特區關係的條款，可怎樣處理？","ev":"發回與修改是兩種不同的權力，條文只容許發回。除本地法律另有規定外，失效不具溯及力。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["代立法會修改後立即公布","發回該法律而不作修改，法律立即失效","只可提出意見，由行政長官決定法律是否失效","交由最高人民法院撤銷"],"ci":1,"refs":[17],"law":"B","negative":false,"id":18},{"art":"第十八條","type":"sa","q":"列入《基本法》附件三的全國性法律，在香港有哪兩種實施方式？","ev":"附件三列出適用的全國性法律，由特區按條文規定在當地實施。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"ans":"在香港公布或立法實施。","refs":[18],"law":"B","negative":false,"id":19},{"art":"第十八條","type":"mc","q":"哪一類法律可列入《基本法》附件三？","ev":"附件三法律的範圍受第十八條限制，並由全國人大常委會按程序增減。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["香港所有涉及公共開支的條例","一切在內地已經生效的地方性法規","特區法院選定的海外成文法","國防、外交和其他不屬特區自治範圍的全國性法律"],"ci":3,"refs":[18],"law":"B","negative":false,"id":20},{"art":"第十九條","type":"mc","q":"香港法院對哪一類事項沒有管轄權？","ev":"第十九條在確認獨立司法權和終審權的同時，訂明國家行為的管轄界限。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["本地財產繼承爭議","國防、外交等國家行為","本地僱傭合約糾紛","本地交通罪行"],"ci":1,"refs":[19],"law":"B","negative":false,"id":21},{"art":"第二十條","type":"sa","q":"除《基本法》已列明的權力外，哪三個中央機關可授予特區其他權力？","ev":"第二十條容許中央層面的這三個機關授予其他權力。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"ans":"全國人民代表大會、全國人大常委會及中央人民政府。","refs":[20],"law":"B","negative":false,"id":22},{"art":"第二十一條","type":"sa","q":"香港居民中的中國公民可在香港選出哪一類代表，參加最高國家權力機關的工作？","ev":"代表依全國人大確定的名額和辦法選出，參與國家事務的管理。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"ans":"香港特區全國人大代表。","refs":[21],"law":"B","negative":false,"id":23},{"art":"第二十二條","type":"mc","q":"某省擬按《基本法》在香港設立機構，需經哪兩道程序？","ev":"特區政府的同意和中央人民政府的批准，兩項要求都須符合。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["先由立法會批准，再由特區政府備案","只須該省政府批准","先經終審法院同意，再由國務院備案","徵得特區政府同意，並經中央人民政府批准"],"ci":3,"refs":[22],"law":"B","negative":false,"id":24},{"art":"第二十三條","type":"sa","q":"《基本法》以哪四個字說明香港特區履行第二十三條立法責任的方式？","ev":"第二十三條要求香港特區自行立法，禁止叛國、分裂國家等行為及條文所列的政治組織活動或聯繫。","chapter":"第二章　中央和香港特別行政區的關係","core":true,"ans":"自行立法。","refs":[23],"law":"B","negative":false,"id":25},{"art":"第二十三條","type":"mc","q":"下列哪一項不是《基本法》第二十三條明文列出的行為？","ev":"這題考第二十三條列舉的行為。洗黑錢屬其他法律處理的範疇。","chapter":"第二章　中央和香港特別行政區的關係","core":false,"opts":["洗黑錢","顛覆中央人民政府","竊取國家機密","叛國"],"ci":0,"refs":[23],"law":"B","negative":true,"id":26},{"art":"第二十四條","type":"sa","q":"香港永久性居民與非永久性居民在身份上的一項關鍵分別是甚麼？","ev":"非永久性居民也有資格依法取得香港居民身份證，單憑持有居民身份證不能斷定有居留權。","chapter":"第三章　居民的基本權利和義務","core":true,"ans":"永久性居民享有香港居留權，非永久性居民沒有該項居留權。","refs":[24],"law":"B","negative":false,"id":27},{"art":"第二十四條","type":"mc","q":"一名中國公民按「在香港通常居住」這項條件取得永久性居民身份，條文規定須連續居住多久？","ev":"七年須為連續通常居住。其他類別的永久性居民按各自條件界定。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["五年以上","十年以上","七年以上","三年以上"],"ci":2,"refs":[24],"law":"B","negative":false,"id":28},{"art":"第二十五、二十六條","type":"mc","q":"哪一項關於平等及選舉權的說法正確？","ev":"第二十五條適用於香港居民。第二十六條指明選舉權及被選舉權的主體為永久性居民。","chapter":"第三章　居民的基本權利和義務","core":true,"opts":["選舉權只限在香港出生的永久性居民","所有香港居民均僅憑居民身份享有被選舉權","只有永久性居民在法律面前平等","香港居民在法律面前一律平等，永久性居民依法享有選舉權和被選舉權"],"ci":3,"refs":[25,26],"law":"B","negative":false,"id":29},{"art":"第二十七條","type":"sa","q":"工人自行組織工會。第二十七條還明文保障哪一項與勞工行動有關的權利？","ev":"條文將組織和參加工會、罷工並列，亦列明言論、出版、集會等自由。","chapter":"第三章　居民的基本權利和義務","core":false,"ans":"罷工的權利和自由。","refs":[27],"law":"B","negative":false,"id":30},{"art":"第二十八、二十九條","type":"mc","q":"哪一項正確區分人身自由與住宅保障？","ev":"兩條所保障的對象包括居民身體、住宅及其他房屋，關鍵在禁止任意或非法的行為。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["兩條分別禁止任意或非法搜查居民身體，以及搜查或侵入其住宅","兩條均容許不附條件地搜查","兩條只保障永久性居民","住宅保障只限居民自置物業"],"ci":0,"refs":[28,29],"law":"B","negative":false,"id":31},{"art":"第三十條","type":"sa","q":"因公共安全和追查刑事犯罪的需要檢查通訊，有關機關仍須符合甚麼要求？","ev":"通訊自由與通訊秘密受法律保護，第三十條對檢查通訊的目的及程序均設有條件。","chapter":"第三章　居民的基本權利和義務","core":false,"ans":"依照法律程序進行。","refs":[30],"law":"B","negative":false,"id":32},{"art":"第三十一條","type":"mc","q":"香港居民持有效旅行證件離開香港，《基本法》訂下甚麼原則？","ev":"第三十一條保障遷徙、移居、旅行及出入境自由，並明列離境的條件。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["只有永久性居民可離境","居民只可作短期旅行，不可移居外地","每次離境均須特區政府特別批准","除非受到法律制止，可自由離開而無需特別批准"],"ci":3,"refs":[31],"law":"B","negative":false,"id":33},{"art":"第三十二至三十四條","type":"mc","q":"哪一項把居民的自由與條文配對正確？","ev":"第三十二條保障信仰及宗教自由，第三十三條保障擇業自由，第三十四條保障研究及創作等自由。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["第三十三條——公開傳教","第三十四條——學術研究及文學藝術創作","第三十二條——選擇職業","第三十四條——罷工"],"ci":1,"refs":[32,33,34],"law":"B","negative":false,"id":34},{"art":"第三十五條","type":"sa","q":"居民認為行政部門的行為侵害其權益，可向哪個機關提起訴訟？","ev":"第三十五條明文保障居民就行政部門和行政人員的行為提起訴訟，也保障獲得司法補救的權利。","chapter":"第三章　居民的基本權利和義務","core":false,"ans":"法院。","refs":[35],"law":"B","negative":false,"id":35},{"art":"第三十六、三十七條","type":"mc","q":"以下哪一組的兩項權利，分別受第三十六及第三十七條明文保障？","ev":"第三十六條保障依法享受社會福利的權利和勞工福利。第三十七條保障婚姻自由和自願生育。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["勞工的退休保障、居民自願生育的權利","必定獲編配公屋、居民自願生育的權利","一律免費醫療、居民必定獲分配工作","勞工的退休保障、居民必定獲分配工作"],"ci":0,"refs":[36,37],"law":"B","negative":false,"id":36},{"art":"第三十八條","chapter":"第三章　居民的基本權利和義務","q":"有同學認為，《基本法》第三章逐項列出的權利，已包括香港居民享有的一切權利。第三十八條如何回應這個說法？","ev":"辨認「其他」二字便能作答。第三十八條把保障延伸至香港法律所保障的其他權利和自由。","core":false,"type":"sa","ans":"居民亦享有香港特別行政區法律保障的其他權利和自由。","refs":[38],"law":"B","negative":false,"id":37},{"art":"第三十九條","type":"sa","q":"《公民權利和政治權利國際公約》等適用於香港的有關規定，通過甚麼方式實施？","ev":"第三十九條規定有關規定繼續有效，並指明本地實施方式。","chapter":"第三章　居民的基本權利和義務","core":false,"ans":"通過香港特別行政區的法律實施。","refs":[39],"law":"B","negative":false,"id":38},{"art":"第四十條","type":"sa","q":"第四十條特別保護哪個群體的合法傳統權益？","ev":"條文的保障限於合法傳統權益，對象為新界原居民。","chapter":"第三章　居民的基本權利和義務","core":false,"ans":"新界原居民。","refs":[40],"law":"B","negative":false,"id":39},{"art":"第四、四十一、四十二條","type":"mc","q":"一名旅客在香港逗留，以下哪一項正確？","ev":"第四十一條涵蓋在港的其他人。第四十二條亦明定他們有守法義務。","chapter":"第三章　居民的基本權利和義務","core":false,"opts":["旅客不享有任何法定權利","依法享有第三章規定的權利和自由，亦須遵守香港實行的法律","只有定居後才須守法","旅客自動享有永久性居民的被選舉權"],"ci":1,"refs":[4,41,42],"law":"B","negative":false,"id":40},{"art":"第四十三、六十條","type":"sa","q":"行政長官兼任特區及特區政府首長。依《基本法》，行政長官對哪兩方負責？","ev":"第四十三條訂明行政長官代表特區並向兩方負責。第六十條另訂明行政長官是特區政府首長。","chapter":"第四章　政治體制","core":true,"ans":"中央人民政府和香港特別行政區。","refs":[43,60],"law":"B","negative":false,"id":41},{"art":"第四十四、六十一條","type":"mc","q":"單就連續通常居港年期而言，行政長官與主要官員的最低要求分別是多少？","ev":"兩類職位均須由在外國無居留權的香港永久性居民中的中國公民擔任。行政長官另須年滿四十周歲。","chapter":"第四章　政治體制","core":true,"opts":["兩者均為十五年","行政長官十五年，主要官員二十年","兩者均為二十年","行政長官二十年，主要官員十五年"],"ci":3,"refs":[44,61],"law":"B","negative":false,"id":42},{"art":"第四十四條","chapter":"第四章　政治體制","q":"行政長官除須通常連續居港滿二十年外，在年齡、國籍、香港居民身份及外國居留權方面還須符合哪些條件？","ev":"四項缺一不可。題幹已交代二十年的連續通常居港要求。","core":true,"type":"sa","ans":"年滿四十周歲、是中國公民、是香港永久性居民，並在外國無居留權。","refs":[44],"law":"B","negative":false,"id":43},{"art":"第四十五、六十八條","type":"mc","q":"按《基本法》，行政長官與立法會的兩個最終普選目標怎樣區分？","ev":"兩條均要求按香港實際情況和循序漸進的原則規定產生辦法，須區分最終目標與具體產生辦法。","chapter":"第四章　政治體制","core":false,"opts":["行政長官由港區全國人大代表互選，立法會全部席位由選舉委員會產生","行政長官由立法會提名後普選，立法會由行政長官委任","行政長官由具廣泛代表性的提名委員會按民主程序提名後普選產生，立法會則是全部議員由普選產生","兩者均由立法會互選產生"],"ci":2,"refs":[45,68],"law":"B","negative":false,"id":44},{"art":"第四十六、六十九條","type":"sa","q":"行政長官與立法會的每屆任期分別有多長？（立法會第一屆除外。）","ev":"行政長官可連任一次。立法會除第一屆為兩年外，每屆四年。","chapter":"第四章　政治體制","core":true,"ans":"行政長官五年，立法會四年。","refs":[46,69],"law":"B","negative":false,"id":45},{"art":"第四十七條","type":"mc","q":"行政長官就任時，須向誰申報財產？","ev":"行政長官須廉潔奉公、盡忠職守，就任時向終審法院首席法官申報財產，記錄在案。","chapter":"第四章　政治體制","core":false,"opts":["立法會主席","廉政專員","政務司司長","終審法院首席法官"],"ci":3,"refs":[47],"law":"B","negative":false,"id":46},{"art":"第四十八、七十六條","type":"sa","q":"立法會已通過一項法案，還須由誰簽署、公布，方能生效？","ev":"簽署及公布法律屬行政長官職權，立法會通過法案後須履行這一步驟。","chapter":"第四章　政治體制","core":false,"ans":"行政長官。","refs":[48,76],"law":"B","negative":false,"id":47},{"art":"第四十九、五十條","type":"mc","q":"行政長官將法案發回重議，立法會須以甚麼門檻再次通過原案，才觸發行政長官簽署公布或按第五十條處理的規定？","ev":"達到門檻後，行政長官須於一個月內簽署公布或按第五十條處理。解散立法會須符合法定條件。","chapter":"第四章　政治體制","core":false,"opts":["出席議員過半數","不少於全體議員三分之二","出席議員三分之二","全體議員過半數"],"ci":1,"refs":[49,50],"law":"B","negative":false,"id":48},{"art":"第五十、五十六條","type":"sa","q":"行政長官依法解散立法會前須徵詢哪個機構？一任內最多可解散多少次？","ev":"第五十條設有次數上限。第五十及五十六條均訂明解散前須徵詢行政會議。","chapter":"第四章　政治體制","core":false,"ans":"行政會議，一次。","refs":[50,56],"law":"B","negative":false,"id":49},{"art":"第五十一、五十二條","type":"mc","q":"立法會拒絕通過預算案，依法解散重選後仍拒絕通過所爭議的原案。行政長官必須怎樣做？","ev":"第五十一條容許在指定情況下臨時撥款。重選後仍拒絕原案則觸發第五十二條的辭職規定。","chapter":"第四章　政治體制","core":false,"opts":["辭職","再次解散立法會","永久以臨時撥款取代預算案","請法院代為通過預算案"],"ci":0,"refs":[51,52],"law":"B","negative":false,"id":50},{"art":"第五十三條","type":"sa","q":"行政長官短期不能履職，三位司長依甚麼次序臨時代理？","ev":"政務司司長居首。若行政長官缺位，須在六個月內依第四十五條產生新的行政長官。","chapter":"第四章　政治體制","core":false,"ans":"政務司司長、財政司司長、律政司司長。","refs":[53],"law":"B","negative":false,"id":51},{"art":"第五十四至五十六條","type":"sa","q":"行政會議的主要功能是甚麼？由誰主持？","ev":"行政會議成員由行政長官委任。若行政長官不採納多數成員的意見，須將具體理由記錄在案。","chapter":"第四章　政治體制","core":true,"ans":"協助行政長官決策，由行政長官主持。","refs":[54,55,56],"law":"B","negative":false,"id":52},{"art":"第五十七、五十八條","type":"mc","q":"哪兩個機構均按《基本法》獨立工作，對行政長官負責？","ev":"第五十七條和第五十八條分別為廉政公署及審計署訂立相同的獨立工作和問責安排。","chapter":"第四章　政治體制","core":false,"opts":["廉政公署及審計署","廉政公署及立法會","審計署及終審法院","立法會及律政司"],"ci":0,"refs":[57,58],"law":"B","negative":false,"id":53},{"art":"第五十九、六十二、七十三條","type":"mc","q":"就特區財政預算而言，哪項分工正確？","ev":"政府是行政機關，負責擬備預算。立法會根據政府提案審核和通過預算。","chapter":"第四章　政治體制","core":false,"opts":["政府編制並提出，立法會審核及通過","立法會編制並提出，政府審核及通過","行政會議編制並通過，立法會備案","審計署提出，律政司通過"],"ci":0,"refs":[59,62,73],"law":"B","negative":false,"id":54},{"art":"第六十三條","type":"sa","q":"香港的刑事檢察工作由誰主管？","ev":"第六十三條訂明律政司主管刑事檢察工作，不受任何干涉。審判權則由法院行使。","chapter":"第四章　政治體制","core":true,"ans":"律政司。","refs":[63],"law":"B","negative":false,"id":55},{"art":"第六十四、七十三條","type":"mc","q":"哪一項不是《基本法》列明特區政府對立法會負責的方式？","ev":"立法會可就政府工作提出質詢並批准稅收及公共開支。立法會主席由議員互選產生。","chapter":"第四章　政治體制","core":false,"opts":["徵稅和公共開支須經立法會批准","定期向立法會作施政報告","答覆立法會議員質詢","委任立法會主席"],"ci":3,"refs":[64,73],"law":"B","negative":true,"id":56},{"art":"第六十六、六十七條","type":"mc","q":"香港的立法機關是立法會。非中國籍或在外國有居留權的香港永久性居民當選議員，其所佔比例上限是多少？","ev":"第六十七條容許指定類別的永久性居民當選，但對他們所佔的總比例設限。","chapter":"第四章　政治體制","core":false,"opts":["全體議員的三分之一","全體議員的百分之十","全體議員的百分之二十","全體議員的二分之一"],"ci":2,"refs":[66,67],"law":"B","negative":false,"id":57},{"art":"第七十條","type":"sa","q":"立法會經行政長官依法解散後，須於多久內重行選舉產生？","ev":"第七十條所指的是立法會重選。行政長官缺位後產生新行政長官的期限則是六個月。","chapter":"第四章　政治體制","core":false,"ans":"三個月內。","refs":[70],"law":"B","negative":false,"id":58},{"art":"第七十一、七十二條","type":"sa","q":"立法會由誰主持會議？擔任這個職位的人如何產生？","ev":"主席亦決定議程和開會時間。政府提出的議案須優先列入議程。","chapter":"第四章　政治體制","core":false,"ans":"立法會主席，由立法會議員互選產生。","refs":[71,72],"law":"B","negative":false,"id":59},{"art":"第七十四條","type":"mc","q":"立法會議員擬提出一項涉及政府政策、但不涉及公共開支、政治體制或政府運作的法律草案，提出前須取得甚麼？","ev":"第七十四條區分議員可提出的法律草案範圍，以及涉及政府政策時的書面同意要求。","chapter":"第四章　政治體制","core":false,"opts":["立法會主席口頭同意","行政長官的書面同意","行政會議全體成員簽署","全國人大常委會批准"],"ci":1,"refs":[74],"law":"B","negative":false,"id":60},{"art":"第七十五條","type":"sa","q":"立法會舉行會議的法定人數為多少？","ev":"法定人數是舉行會議所需人數，個別議案獲通過所需票數另有規定。","chapter":"第四章　政治體制","core":false,"ans":"不少於全體議員的二分之一。","refs":[75],"law":"B","negative":false,"id":61},{"art":"第七十七、七十八條","type":"mc","q":"下列哪一項準確說明《基本法》賦予立法會議員的保障？","ev":"兩條分別規定發言和出席會議方面的保障，均有其特定適用場合。","chapter":"第四章　政治體制","core":false,"opts":["卸任後出席私人活動時仍不受逮捕","任期內在任何地方一律不受逮捕","在立法會會議上發言不受法律追究，出席會議時和赴會途中不受逮捕","任期內在任何場合的發言都不受法律追究"],"ci":2,"refs":[77,78],"law":"B","negative":false,"id":62},{"art":"第七十九條","type":"mc","q":"一名議員喪失香港永久性居民身份，依第七十九條由誰宣告其喪失議員資格？","ev":"喪失或放棄香港永久性居民身份，是第七十九條列明由立法會主席宣告議員喪失資格的情況之一。","chapter":"第四章　政治體制","core":false,"opts":["行政會議召集人","行政長官","立法會主席","選舉委員會總召集人"],"ci":2,"refs":[79],"law":"B","negative":false,"id":63},{"art":"第八十至八十二條","type":"mc","q":"香港各級法院行使審判權。哪個法院行使終審權，並可按需要邀請其他普通法適用地區法官參加審判？","ev":"高等法院分設上訴法庭和原訟法庭，特區的終審權則屬終審法院。","chapter":"第四章　政治體制","core":false,"opts":["高等法院上訴法庭","高等法院原訟法庭","終審法院","區域法院"],"ci":2,"refs":[80,81,82],"law":"B","negative":false,"id":64},{"art":"第八十三條、第九十一條、第九十四條","chapter":"第四章　政治體制","q":"關於香港的法院、司法人員及律師，哪些說法正確？\n（1）各級法院的組織和職權由法律規定。\n（2）法官以外的其他司法人員保留原有任免制度。\n（3）只准本地律師在香港執業。\n（4）特區政府可參照原有辦法，規定本地和外來律師在港執業的安排。","ev":"第八十三條規定法院的組織和職權，第九十一條保留其他司法人員原有的任免制度。第九十四條同時提及當地和外來律師，因此（3）有誤。","core":false,"type":"mc","opts":["（1）、（3）及（4）","（1）、（2）及（4）","（1）、（2）及（3）","（2）、（3）及（4）"],"ci":1,"refs":[83,91,94],"law":"B","negative":false,"id":65},{"art":"第八十四至八十六條","type":"mc","q":"關於香港法院審判案件，下列哪一項正確？","ev":"法院按適用於香港的法律獨立審判，外地普通法判例可作參考，原有陪審制度的原則亦予保留。","chapter":"第四章　政治體制","core":false,"opts":["所有海外判例均自動約束香港法院","法院獨立審判，可參考其他普通法適用地區的司法判例","陪審制度的原則已由《基本法》取消","法院審判須先取得行政會議同意"],"ci":1,"refs":[84,85,86],"law":"B","negative":false,"id":66},{"art":"第八十七條","type":"sa","q":"被告在未經司法機關判罪前，法律上假定其處於甚麼狀態？","ev":"合法被捕的人亦享有盡早接受司法機關公正審判的權利。","chapter":"第四章　政治體制","core":false,"ans":"假定無罪。","refs":[87],"law":"B","negative":false,"id":67},{"art":"第八十八、九十條","type":"sa","q":"任命終審法院法官時，除獨立委員會推薦外，行政長官還須徵得哪個機關同意，並報哪個機關備案？","ev":"一般法官由行政長官按獨立委員會推薦任命，終審法院法官及高等法院首席法官另有第九十條的程序。","chapter":"第四章　政治體制","core":false,"ans":"徵得立法會同意，報全國人大常委會備案。","refs":[88,90],"law":"B","negative":false,"id":68},{"art":"第八十九條","type":"sa","q":"法官只有在哪兩種情況下，才可按第八十九條訂明的程序被免職？","ev":"免職須按法定程序進行，包括由審議庭提出建議。條文亦就終審法院首席法官另訂審議庭的組成。","chapter":"第四章　政治體制","core":false,"ans":"無力履行職責，或行為不檢。","refs":[89],"law":"B","negative":false,"id":69},{"art":"第九十二、九十三條","type":"mc","q":"香港選用法官和其他司法人員，主要按甚麼準則？","ev":"可從其他普通法適用地區聘用。回歸前已在香港任職的法官和司法人員亦可留用，並保留年資。","chapter":"第四章　政治體制","core":false,"opts":["本人的司法和專業才能","是否全由公務員內部晉升","是否一律出生於香港","是否曾任立法會議員"],"ci":0,"refs":[92,93],"law":"B","negative":false,"id":70},{"art":"第九十三條、第一百零二條","chapter":"第四章　政治體制","q":"已退休的香港公務人員和法官移居海外，特區政府可否單因其居住地改變，而調低他們應得的退休金？","ev":"兩條分別保障司法人員和公務人員。支付應得的退休待遇時，國籍和居住地點均不影響這項保障。","core":false,"type":"sa","ans":"不可以。特區政府仍須按不低於原來的標準支付。","refs":[93,102],"law":"B","negative":false,"id":71},{"art":"第九十五、九十六條","type":"mc","q":"香港與內地、外國進行司法互助，哪一項正確？","ev":"兩條分別規定與全國其他地區及外國進行司法合作的方法。","chapter":"第四章　政治體制","core":false,"opts":["所有司法互助均須先修改《基本法》","香港只能與其他普通法地區互助","與外國或內地的安排都由立法會自行簽訂","可與全國其他地區司法機關依法協商，與外國的安排則在中央協助或授權下進行"],"ci":3,"refs":[95,96],"law":"B","negative":false,"id":72},{"art":"第九十七、九十八條","type":"sa","q":"《基本法》容許設立的區域組織具有甚麼性質？其職權和組成方法由甚麼規定？","ev":"區域組織可就地區管理等事務接受政府諮詢，或提供文化、康樂、環境衞生等服務。","chapter":"第四章　政治體制","core":false,"ans":"非政權性，由法律規定。","refs":[97,98],"law":"B","negative":false,"id":73},{"art":"第九十九至一百零一條","type":"mc","q":"以下哪句最準確概括《基本法》關於公務人員任用的規定？","ev":"第九十九條訂明一般資格及例外，第一百條容許回歸前公務人員留用，第一百零一條對部分職位另有國籍與居留權要求。","chapter":"第四章　政治體制","core":false,"opts":["所有主要官員均可由在外國有居留權的人擔任","所有職級一律只限中國公民擔任","原則上須是香港永久性居民，條文對外籍人員等情況另設例外","回歸前的公務人員全部須重新考取職位"],"ci":2,"refs":[99,100,101],"law":"B","negative":false,"id":74},{"art":"第一百零三條","type":"sa","q":"任用及提升公務人員應根據哪三項個人條件？","ev":"第一百零三條列明任用準則，並保留原有招聘、考核、培訓等制度，但給予外籍人員特權待遇的規定除外。","chapter":"第四章　政治體制","core":false,"ans":"資格、經驗和才能。","refs":[103],"law":"B","negative":false,"id":75},{"art":"第一百零四條","type":"sa","q":"行政長官、主要官員、行政會議成員、立法會議員、法官及其他司法人員就職時，須依法宣誓哪兩項承諾？","ev":"作答時要分清擁護的法律和效忠的對象。","chapter":"第四章　政治體制","core":true,"ans":"擁護《中華人民共和國香港特別行政區基本法》，效忠中華人民共和國香港特別行政區。","refs":[104],"law":"B","negative":false,"id":76},{"art":"第六、一百零五條","type":"mc","q":"特區依法徵用私人財產時，補償額應以甚麼為準？","ev":"第六條保障私有財產權。第一百零五條訂明徵用補償的價值基準，並要求可自由兌換及不得無故遲延支付。","chapter":"第五章　經濟","core":false,"opts":["由徵用機關任意釐定","該財產當時的實際價值","該財產最初購入價的一半","以業主的家庭收入計算"],"ci":1,"refs":[6,105],"law":"B","negative":false,"id":77},{"art":"第一百零六、一百零八條","type":"mc","q":"哪一項符合香港財政獨立及獨立稅制的規定？","ev":"第一百零六條規定財政收入不上繳中央。第一百零八條容許香港參照原有低稅政策，自行立法規定稅務事項。","chapter":"第五章　經濟","core":true,"opts":["香港的財政收入用於自身需要，中央人民政府不在港徵稅","香港各項稅率一律由中央人民政府統一制定","香港每次寬減稅款均須由全國人大批准","香港所有財政收入須先上繳中央再獲分配"],"ci":0,"refs":[106,108],"law":"B","negative":false,"id":78},{"art":"第一百零七條","type":"sa","q":"《基本法》以哪四個字概括香港財政預算的原則？","ev":"特區須力求收支平衡，避免赤字，並與本地生產總值的增長率相適應。","chapter":"第五章　經濟","core":false,"ans":"量入為出。","refs":[107],"law":"B","negative":false,"id":79},{"art":"第一百零九、一百一十條","type":"mc","q":"為保持香港的國際金融中心地位，哪一項安排符合《基本法》？","ev":"第一百零九條訂明金融中心的政策目標，第一百一十條則規定特區自行制定政策並依法管理和監督。","chapter":"第五章　經濟","core":false,"opts":["貨幣金融政策須由其他金融中心代為制定","特區政府只負責推廣，不能監管金融市場","特區政府提供適當經濟和法律環境，並自行制定貨幣金融政策","金融機構獲豁免遵守香港法律"],"ci":2,"refs":[109,110],"law":"B","negative":false,"id":80},{"art":"第一百一十一條","type":"sa","q":"港幣的發行權屬誰？發行港幣須有多少準備金？","ev":"港元是香港的法定貨幣。符合條件時，特區政府可授權指定銀行發行港幣。","chapter":"第五章　經濟","core":false,"ans":"屬香港特區政府，須有百分之百的準備金。","refs":[111],"law":"B","negative":false,"id":81},{"art":"第一百一十二、一百一十三條","type":"mc","q":"港幣可自由兌換。外匯基金的主要用途是甚麼？","ev":"香港不實行外匯管制。外匯基金由特區政府管理和支配，主要用於調節港元匯價。","chapter":"第五章　經濟","core":false,"opts":["代國家支付駐軍費用","為所有進口貨物補貼關稅","調節港元匯價","發放退休公務員薪酬"],"ci":2,"refs":[112,113],"law":"B","negative":false,"id":82},{"art":"第一百一十四至一百一十六條","type":"mc","q":"「自由港」和「單獨關稅地區」在《基本法》中分別有甚麼含義？","ev":"第一百一十四條保留自由港地位，第一百一十五條保障自由貿易，第一百一十六條確認香港為單獨關稅地區。","chapter":"第五章　經濟","core":true,"opts":["香港必須跟隨內地關稅政策，不得另行參加貿易協定","除法律另有規定外不徵收關稅，香港可以「中國香港」名義參加有關國際貿易協定","每件進口貨物均徵收同一關稅，出口配額全歸中央","不徵收任何本地稅項，任何國際條約均由香港自行締結"],"ci":1,"refs":[114,115,116],"law":"B","negative":false,"id":83},{"art":"第一百一十七條","chapter":"第五章　經濟","q":"一批貨品需要證明其產地，特區可根據當時的產地規則簽發甚麼文件？","ev":"關鍵是證明產品來自哪裏。條文使用的名稱是「產地來源證」。","core":false,"type":"sa","ans":"產地來源證。","refs":[117],"law":"B","negative":false,"id":84},{"art":"第一百一十八、一百一十九條","type":"sa","q":"特區政府鼓勵投資、技術進步和產業發展時，《基本法》還要求注意哪一方面？","ev":"第一百一十八條涉及新興產業發展，第一百一十九條則在推動各行業發展時明列環境保護。","chapter":"第五章　經濟","core":false,"ans":"環境保護。","refs":[118,119],"law":"B","negative":false,"id":85},{"art":"第一百二十、一百二十三條","type":"mc","q":"回歸前已批出且年期跨越1997年6月30日的土地契約，在特區成立後怎樣處理？","ev":"回歸本身不令這類契約失效。特區成立後屆滿且沒有續期權利的契約，由特區自行制定法律和政策處理。","chapter":"第五章　經濟","core":false,"opts":["依香港特區法律繼續承認和保護契約及有關權利","一律於回歸當日自動終止","須由中央逐宗重新批出","一律取消年期限制"],"ci":0,"refs":[120,123],"law":"B","negative":false,"id":86},{"art":"第一百二十一條、第一百二十二條","chapter":"第五章　經濟","q":"就第一百二十一條所指的土地契約，承租人自1997年7月1日起毋須補地價。這是否代表也毋須繳交每年租金？","ev":"兩者要分清。第一百二十一條分別規定補地價和年租，第一百二十二條另訂特定農村土地在符合條件下維持原定租金。","core":false,"type":"sa","ans":"仍須每年繳租，按土地應課差餉租值的百分之三計算。","refs":[121,122],"law":"B","negative":false,"id":87},{"art":"第一百二十四條、第一百二十七條、第一百三十五條","chapter":"第五章　經濟","q":"特區成立後，私營貨櫃碼頭可否繼續自由經營？回歸前已在港註冊並以香港為主要營業地的航空公司又如何？","ev":"第一百二十四條保留原有航運經營和管理體制，第一百二十七條明列私營集裝箱碼頭，第一百三十五條訂明相關航空公司可繼續經營。","core":false,"type":"sa","ans":"私營貨櫃碼頭可繼續自由經營，符合題述條件的航空公司亦可繼續經營。","refs":[124,127,135],"law":"B","negative":false,"id":88},{"art":"第一百二十五、一百二十六條","type":"sa","q":"香港經中央授權，以甚麼名義頒發船舶登記證件？外國軍用船隻進入香港須獲誰特別許可？","ev":"特區獲授權處理船舶登記，而外國軍艦進入香港涉及中央的許可。","chapter":"第五章　經濟","core":false,"ans":"「中國香港」，須獲中央人民政府特別許可。","refs":[125,126],"law":"B","negative":false,"id":89},{"art":"第一百二十八至一百三十條","type":"mc","q":"哪一項屬香港特區自行負責的民航日常業務及技術管理？","ev":"香港須保持國際和區域航空中心地位，自行管理機場及相關空管服務。外國國家航空器入境須經中央特別許可。","chapter":"第五章　經濟","core":false,"opts":["批准外國國家航空器進入香港","在香港飛行情報區內提供空中交通服務","管理中國所有民航機場","釐定全國飛機的國籍標誌"],"ci":1,"refs":[128,129,130],"law":"B","negative":false,"id":90},{"art":"第一百三十一條","chapter":"第五章　經濟","q":"誰在與特區政府磋商後，為符合條件的航空公司安排往返香港與內地的航班？","ev":"條文把磋商雙方和航線範圍一併列明。作出安排的是中央人民政府，航線往返香港與中國其他地區。","core":false,"type":"sa","ans":"中央人民政府。","refs":[131],"law":"B","negative":false,"id":91},{"art":"第一百三十二至一百三十四條","type":"mc","q":"由外國飛往內地、經停香港的航班，其民用航空運輸協定由誰簽訂？","ev":"涉及中國其他地區與外國往返並經停香港的航班，協定由中央簽訂。特區可在中央具體授權下就其他指定航線談判簽約或處理執行安排。","chapter":"第五章　經濟","core":false,"opts":["香港機場管理局","中央人民政府","香港特區政府單獨簽訂","航空公司自行簽訂"],"ci":1,"refs":[132,133,134],"law":"B","negative":false,"id":92},{"art":"第一百三十六、一百三十七條","type":"mc","q":"下列哪一項最能準確說明香港教育制度中政府與院校的角色？","ev":"特區政府可制定教學語言、考試等政策，院校可從外地招聘教職員和選用教材，學生亦有選擇院校及出外求學的自由。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"opts":["學生不得選擇到香港以外求學","特區政府不得制定考試政策","特區政府自行制定教育政策，各類院校可保留自主性並享有學術自由","院校必須只從香港招聘教職員"],"ci":2,"refs":[136,137],"law":"B","negative":false,"id":93},{"art":"第一百三十七、一百四十一條","type":"sa","q":"宗教團體原在香港辦學。特區成立後，這些學校能否繼續開設宗教課程？","ev":"第一百三十七條明列開設宗教課程。第一百四十一條亦容許宗教組織按原有辦法繼續辦學及提供其他社會服務。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"ans":"可以。宗教組織所辦學校可繼續提供宗教教育。","refs":[137,141],"law":"B","negative":false,"id":94},{"art":"第一百三十八至一百四十條","type":"mc","q":"以下哪項是《基本法》列明特區以法律保護的成果？","ev":"特區自行制定醫療衞生、科技和文化政策。科技研究成果和作者在文學藝術創作中所獲得的成果及合法權益受法律保護。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"opts":["每本著作均獲政府出版","每項投資獲得固定利潤","科學技術的研究成果、專利和發明創造","每個體育項目取得獎牌"],"ci":2,"refs":[138,139,140],"law":"B","negative":false,"id":95},{"art":"第一百四十二條","type":"mc","q":"獲特區政府承認的專業團體，對本身的專業資格有甚麼權力？","ev":"特區可在保留原有專業制度的基礎上，自行制定評審執業資格的辦法。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"opts":["制定全國適用的執業資格","自行修改《基本法》規定的職位資格","代所有海外大學頒授學位","自行審核和頒授專業資格"],"ci":3,"refs":[142],"law":"B","negative":false,"id":96},{"art":"第一百四十三至一百四十七條","type":"sa","q":"特區政府在原有社會福利制度的基礎上，制定發展、改進政策時須考慮哪兩項因素？","ev":"政府自行制定社會福利、體育及勞工政策，亦維持原有民間機構資助政策。志願團體可在不抵觸法律下自行決定服務方式。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"ans":"經濟條件和社會需要。","refs":[143,144,145,146,147],"law":"B","negative":false,"id":97},{"art":"第一百四十八、一百四十九條","type":"sa","q":"香港民間教育或體育團體與內地相應團體交往，以哪三項原則為基礎？","ev":"這些團體亦可與世界各地的相關組織保持聯繫，按需要以「中國香港」名義參與活動。","chapter":"第六章　教育、科學、文化、體育、宗教、勞工和社會服務","core":false,"ans":"互不隸屬、互不干涉、互相尊重。","refs":[148,149],"law":"B","negative":false,"id":98},{"art":"第一百五十、一百五十一條","type":"mc","q":"中央與外國進行直接關乎香港的外交談判時，特區政府代表可以甚麼身份參加？","ev":"外交談判由中央進行。經貿、文化、體育等對外事務，香港可依第一百五十一條以「中國香港」名義單獨簽訂和履行有關協議。","chapter":"第七章　對外事務","core":false,"opts":["以全國人大常委會委員身份自動出席","以另一個主權國家代表身份","作為中華人民共和國政府代表團成員","只可以個人觀察員身份"],"ci":2,"refs":[150,151],"law":"B","negative":false,"id":99},{"art":"第一百五十二條","type":"sa","q":"香港可用甚麼名義，參加不以國家為單位的國際組織和國際會議？","ev":"如屬以國家為單位參加者，特區可在條文所指情況下，作為中國代表團成員或以獲允許的身份參與。","chapter":"第七章　對外事務","core":false,"ans":"中國香港。","refs":[152],"law":"B","negative":false,"id":100},{"art":"第一百五十三條","type":"mc","q":"中國締結的國際協議是否適用於香港，由誰在徵詢特區政府意見後決定？","ev":"中央人民政府可按香港的情況和需要，徵詢特區意見後作決定。","chapter":"第七章　對外事務","core":false,"opts":["立法會主席","中央人民政府","終審法院首席法官","香港行政會議"],"ci":1,"refs":[153],"law":"B","negative":false,"id":101},{"art":"第一百五十四條","type":"sa","q":"獲簽發香港特區護照的人，必須同時符合哪兩項身份條件？","ev":"中央授權特區政府依法簽發護照。在港其他合法居留者可獲簽發的是其他旅行證件。","chapter":"第七章　對外事務","core":true,"ans":"是中國公民，並持有香港特區永久性居民身份證。","refs":[154],"law":"B","negative":false,"id":102},{"art":"第一百五十五至一百五十七條","type":"sa","q":"特區在外國設經貿機構，與外國在港設領事機構，向中央辦理的手續有何不同？","ev":"設經貿機構與設領事機構的手續不同。另一項對外安排是特區在中央協助或授權下與外地締結互免簽證協議。","chapter":"第七章　對外事務","core":false,"ans":"前者報中央人民政府備案，後者須經中央人民政府批准。","refs":[155,156,157],"law":"B","negative":false,"id":103},{"art":"第一百五十八、一百五十九條","type":"mc","q":"《基本法》的解釋權和修改權分別屬於哪兩個機關？","ev":"第一百五十八條和第一百五十九條分別規定解釋和修改，兩項權力的法定主體不同。","chapter":"第八章　本法的解釋和修改","core":true,"opts":["解釋權屬全國人大常委會，修改權屬全國人民代表大會","解釋權屬國務院，修改權屬香港行政長官","解釋權屬全國人民代表大會，修改權屬全國人大常委會","解釋權屬香港終審法院，修改權屬立法會"],"ci":0,"refs":[158,159],"law":"B","negative":false,"id":104},{"art":"第一百五十八條","type":"sa","q":"港區法院審案時，獲授權自行解釋《基本法》哪一類條款？","ev":"授權來自全國人大常委會。法院審案時亦可解釋其他條款，但涉及中央事務等特定情形則須提請解釋。","chapter":"第八章　本法的解釋和修改","core":false,"ans":"關於香港特區自治範圍內的條款。","refs":[158],"law":"B","negative":false,"id":105},{"art":"第一百五十八條","type":"mc","q":"某案須解釋關於中央管理事務的條款，而解釋會影響判決。在不可上訴的終局判決前，應由誰向誰提請解釋？","ev":"條文指定由終審法院提請。全國人大常委會作出解釋後，香港法院引用有關條款時應以該解釋為準。","chapter":"第八章　本法的解釋和修改","core":false,"opts":["香港行政長官向國務院提請解釋","原訟法庭直接向最高人民法院提請解釋","香港終審法院向全國人大常委會提請解釋","香港立法會向全國人大提請解釋"],"ci":2,"refs":[158],"law":"B","negative":false,"id":106},{"art":"第一百五十九條","type":"sa","q":"哪三方有權提出《基本法》修改提案？","ev":"特區提出修改議案，須經港區全國人大代表三分之二多數、立法會全體議員三分之二多數及行政長官同意，再由港區全國人大代表團提出。","chapter":"第八章　本法的解釋和修改","core":false,"ans":"全國人大常委會、國務院、香港特別行政區。","refs":[159],"law":"B","negative":false,"id":107},{"art":"第一百五十九條","type":"sa","q":"《基本法》的任何修改均須遵守哪一項內容限制？","ev":"第一百五十九條除訂明修改程序外，也為修改內容設定界限。","chapter":"第八章　本法的解釋和修改","core":false,"ans":"不得同國家對香港既定的基本方針政策相抵觸。","refs":[159],"law":"B","negative":false,"id":108},{"art":"第一百六十條","type":"sa","q":"按回歸前法律訂立的有效契約，遇上主權移交會否自動失效？","ev":"同一安排亦涵蓋原有法律下有效的文件、證件及權利義務。","chapter":"第九章　附則","core":false,"ans":"不會。只要不抵觸《基本法》，便繼續有效，並獲特區承認和保護。","refs":[160],"law":"B","negative":false,"id":109},{"art":"附件一第二項","type":"sa","q":"按2021年修訂的附件一，選舉委員會共有多少名委員？怎樣分布在五個界別？","ev":"五個界別名額相同。選舉委員會委員須為香港永久性居民，每屆任期五年。","chapter":"附件","core":false,"ans":"共1,500名，每個界別300名。","additional":[{"title":"附件一第二項","body":"選舉委員會委員共1500人，由下列各界人士組成：第一界別：工商、金融界300人第二界別：專業界300人第三界別：基層、勞工和宗教等界300人第四界別：立法會議員、地區組織代表等界300人第五界別：香港特別行政區全國人大代表、香港特別行政區全國政協委員和有關全國性團體香港成員的代表界300人選舉委員會委員必須由香港特別行政區永久性居民擔任。選舉委員會每屆任期五年。"}],"refs":[],"law":"B","negative":false,"id":110},{"art":"附件一第一、六、七項","type":"mc","q":"按2021年修訂的附件一，行政長官候選人至少須獲多少名選委提名？每個界別至少多少名？","ev":"提名須同時達兩項門檻。選委會再以無記名投票選出候任人，須獲超過750票，並由中央人民政府任命。","chapter":"附件","core":false,"opts":["總數150名，每個界別10名","總數188名，每個界別15名","總數188名，每個界別10名","總數150名，每個界別15名"],"ci":1,"additional":[{"title":"附件一第一項（節錄）","body":"行政長官由一個具有廣泛代表性、符合香港特別行政區實際情況、體現社會整體利益的選舉委員會根據本法選出，由中央人民政府任命。"},{"title":"附件一第六項（節錄）","body":"行政長官候選人須獲得不少於188名選舉委員會委員的提名，且上述五個界別中每個界別參與提名的委員須不少於15名。"},{"title":"附件一第七項（節錄）","body":"選舉委員會根據提名的名單，經一人一票無記名投票選出行政長官候任人，行政長官候任人須獲得超過750票。"}],"refs":[],"law":"B","negative":false,"id":111},{"art":"附件二第一項","type":"sa","q":"按2021年修訂的附件二，立法會90席中，選舉委員會、功能團體及分區直接選舉各選出多少席？","ev":"三種產生途徑以選舉委員會的議席最多，其次為功能團體，然後是分區直接選舉。","chapter":"附件","core":true,"ans":"依次為40席、30席、20席。","additional":[{"title":"附件二第一項","body":"香港特別行政區立法會議員每屆90人，組成如下：選舉委員會選舉的議員40人功能團體選舉的議員30人分區直接選舉的議員20人上述選舉委員會即本法附件一規定的選舉委員會。"}],"refs":[],"law":"B","negative":false,"id":112},{"art":"附件一第八項、附件二第五項","type":"mc","q":"哪個委員會負責審查並確認行政長官候選人和立法會議員候選人的資格？","ev":"候選人資格審查委員會負責審查並確認資格。維護國家安全委員會在指定情況下出具審查意見書。","chapter":"附件","core":false,"opts":["選舉委員會","行政會議","候選人資格審查委員會","選舉管理委員會"],"ci":2,"additional":[{"title":"附件一第八項（節錄）","body":"香港特別行政區候選人資格審查委員會負責審查並確認選舉委員會委員候選人和行政長官候選人的資格。"},{"title":"附件二第五項（節錄）","body":"香港特別行政區候選人資格審查委員會負責審查並確認立法會議員候選人的資格。"}],"refs":[],"law":"B","negative":false,"id":113},{"art":"附件二第七項","type":"mc","q":"除《基本法》另有規定外，政府提出的法案在立法會如何通過？","ev":"政府法案與議員個人提出的議案、法案或對政府法案的修正案，表決門檻有所不同。後者須分組各過半數。","chapter":"附件","core":false,"opts":["須獲全體議員一致支持","須按兩組出席議員分開表決，各過半數","須獲全體議員三分之二票","獲出席會議的全體議員過半數票"],"ci":3,"additional":[{"title":"附件二第七項","body":"除本法另有規定外，香港特別行政區立法會對法案和議案的表決採取下列程序：政府提出的法案，如獲得出席會議的全體議員的過半數票，即為通過。立法會議員個人提出的議案、法案和對政府法案的修正案均須分別經選舉委員會選舉產生的議員和功能團體選舉、分區直接選舉產生的議員兩部分出席會議議員各過半數通過。"}],"refs":[],"law":"B","negative":false,"id":114},{"art":"附件三及相關決定（2020年6月30日）","type":"mc","q":"哪一項是2020年6月30日列入《基本法》附件三、並由香港在當地公布實施的全國性法律？","ev":"當日全國人大常委會決定增加《中華人民共和國香港特別行政區維護國家安全法》，並訂明由香港在當地公布實施。","chapter":"附件","core":true,"opts":["《國歌條例》","《香港國安法》","《香港人權法案條例》","《維護國家安全條例》"],"ci":1,"additional":[{"title":"2020年6月30日全國人大常委會決定（節錄）","body":"在《中華人民共和國香港特別行政區基本法》附件三中增加全國性法律《中華人民共和國香港特別行政區維護國家安全法》，並由香港特別行政區在當地公布實施。"}],"refs":[],"law":"B","negative":false,"id":115},{"art":"序言","chapter":"序言","q":"序言把《憲法》稱為國家的甚麼法？它的法律效力居於甚麼地位？","ev":"《憲法》規定國家的根本制度和根本任務，是一切國家機關等必須遵循的根本活動準則。","type":"sa","ans":"根本法，具有最高的法律效力。","core":true,"additional":[{"title":"序言（節錄）","body":"本憲法以法律的形式確認了中國各族人民奮鬥的成果，規定了國家的根本制度和根本任務，是國家的根本法，具有最高的法律效力。"}],"refs":[],"law":"C","negative":false,"id":116},{"art":"序言","chapter":"序言","q":"序言指出，1911年的辛亥革命由誰領導？它廢除了哪項制度？","ev":"序言以廢除封建帝制、創立中華民國說明辛亥革命的歷史作用。","type":"sa","ans":"孫中山，封建帝制。","additional":[{"title":"序言（節錄）","body":"一九一一年孫中山先生領導的辛亥革命，廢除了封建帝制，創立了中華民國。"}],"refs":[],"law":"C","negative":false,"id":117},{"art":"序言","chapter":"序言","q":"依序言所述，哪一項是中華人民共和國成立時已取得的成就？","ev":"序言將1949年建立中華人民共和國與新民主主義革命的勝利相連，其他項目屬建國後的成就或目標。","type":"mc","opts":["完成生產資料私有制的社會主義改造","基本形成比較完整的社會主義工業體系","實現工業、農業、國防和科學技術現代化","取得新民主主義革命的勝利"],"ci":3,"additional":[{"title":"序言（節錄）","body":"一九四九年，以毛澤東主席為領袖的中國共產黨領導中國各族人民，在經歷了長期的艱難曲折的武裝鬥爭和其他形式的鬥爭以後，終於推翻了帝國主義、封建主義和官僚資本主義的統治，取得了新民主主義革命的偉大勝利，建立了中華人民共和國。"}],"refs":[],"law":"C","negative":false,"id":118},{"art":"序言","chapter":"序言","q":"序言指出，我國將長期處於甚麼階段？","ev":"序言接着說明國家的根本任務，是沿着中國特色社會主義道路，集中力量進行社會主義現代化建設。","type":"sa","ans":"社會主義初級階段。","additional":[{"title":"序言（節錄）","body":"我國將長期處於社會主義初級階段。"}],"refs":[],"law":"C","negative":false,"id":119},{"art":"序言","chapter":"序言","q":"序言如何界定中國人民政治協商會議的性質？","ev":"人民政協是統一戰線組織。最高國家權力機關是全國人民代表大會。","type":"mc","opts":["最高國家權力機關","最高國家行政機關","有廣泛代表性的統一戰線組織","行使國家立法權的常設機關"],"ci":2,"core":true,"additional":[{"title":"序言（節錄）","body":"中國人民政治協商會議是有廣泛代表性的統一戰線組織，過去發揮了重要的歷史作用，今後在國家政治生活、社會生活和對外友好活動中，在進行社會主義現代化建設、維護國家的統一和團結的鬥爭中，將進一步發揮它的重要作用。"}],"refs":[],"law":"C","negative":false,"id":120},{"art":"序言","chapter":"序言","q":"下列哪一項不屬於序言列出的和平共處五項原則？","ev":"五項原則還包括互相尊重主權和領土完整、和平共處。","type":"mc","opts":["互不侵犯","集體防衞","平等互利","互不干涉內政"],"ci":1,"additional":[{"title":"序言（節錄）","body":"中國堅持獨立自主的對外政策，堅持互相尊重主權和領土完整、互不侵犯、互不干涉內政、平等互利、和平共處的五項原則，堅持和平發展道路，堅持互利共贏開放戰略，發展同各國的外交關係和經濟、文化交流，推動構建人類命運共同體；堅持反對帝國主義、霸權主義、殖民主義，加強同世界各國人民的團結，支持被壓迫民族和發展中國家爭取和維護民族獨立、發展民族經濟的正義鬥爭，為維護世界和平和促進人類進步事業而努力。"}],"refs":[],"law":"C","negative":true,"id":121},{"art":"序言","chapter":"序言","q":"依序言所述，完成統一祖國的大業是哪些人的神聖職責？","ev":"序言明確將台灣同胞包括在完成統一祖國大業的主體之中。","type":"sa","ans":"包括台灣同胞在內的全中國人民。","additional":[{"title":"序言（節錄）","body":"完成統一祖國的大業是包括台灣同胞在內的全中國人民的神聖職責。"}],"refs":[],"law":"C","negative":false,"id":122},{"art":"通過及公布日期","chapter":"序言","q":"現行《中華人民共和國憲法》在哪一年、哪一月、哪一日通過並公布施行？","ev":"第五屆全國人民代表大會第五次會議通過現行憲法，同日公布施行。","core":true,"type":"sa","ans":"1982年12月4日。","additional":[{"title":"通過及公布日期","body":"1982年12月4日第五屆全國人民代表大會第五次會議通過　1982年12月4日全國人民代表大會公告公布施行"}],"refs":[],"law":"C","negative":false,"id":123},{"art":"第一條","chapter":"第一章　總綱","q":"《憲法》確立的國家根本制度是甚麼？","ev":"第一條明定社會主義制度為根本制度，並禁止任何組織或者個人破壞該制度。","type":"mc","opts":["社會主義制度","民族區域自治制度","基層群眾自治制度","多黨合作和政治協商制度"],"ci":0,"core":true,"refs":[1],"law":"C","negative":false,"id":124},{"art":"第一條","chapter":"第一章　總綱","q":"《憲法》指出，中國特色社會主義最本質的特徵是甚麼？","ev":"第一條在闡明社會主義制度的地位時，明確指出中國共產黨領導的地位。","type":"sa","ans":"中國共產黨領導。","core":true,"refs":[1],"law":"C","negative":false,"id":125},{"art":"第一條","chapter":"第一章　總綱","q":"《憲法》形容我國是人民民主專政的社會主義國家。哪一項正確配對了領導階級與政權基礎？","ev":"第一條分別以工人階級和工農聯盟說明國家的領導階級和政權基礎。","type":"mc","opts":["工人階級領導，以工農聯盟為基礎","工人階級領導，以各民族聯盟為基礎","農民階級領導，以工農聯盟為基礎","知識分子領導，以各民族聯盟為基礎"],"ci":0,"refs":[1],"law":"C","negative":false,"id":126},{"art":"第二條","chapter":"第一章　總綱","q":"國家的一切權力屬於誰？人民通過哪些代表機關行使國家權力？","ev":"第二條把國家權力的歸屬和人民行使國家權力的機關分別列明。","type":"sa","ans":"屬於人民。代表機關是全國人民代表大會和地方各級人民代表大會。","core":true,"refs":[2],"law":"C","negative":false,"id":127},{"art":"第三條","chapter":"第一章　總綱","q":"人民代表大會由民主選舉產生，行政、監察、審判和檢察機關由人大產生。這體現國家機構實行哪項原則？","ev":"第三條指出，人大向人民負責並受人民監督，而由人大產生的國家機關向人大負責並受其監督。","type":"mc","opts":["行政首長負責制","民族區域自治","基層群眾自治","民主集中制"],"ci":3,"core":true,"refs":[3],"law":"C","negative":false,"id":128},{"art":"第四條","chapter":"第一章　總綱","q":"依《憲法》規定，在哪些地方實行民族區域自治？","ev":"這些地方設立自治機關，依法行使自治權，都是中華人民共和國不可分離的部分。","type":"sa","ans":"各少數民族聚居的地方。","refs":[4],"law":"C","negative":false,"id":129},{"art":"第五條","chapter":"第一章　總綱","q":"關於法律、行政法規及地方性法規與《憲法》的關係，哪項正確？","ev":"第五條規定，法律、行政法規及地方性法規均不得與憲法相抵觸。","type":"mc","opts":["只有行政法規可與《憲法》相抵觸","三者均不得與《憲法》相抵觸","只有地方性法規可與《憲法》相抵觸","法律經全國人大通過後即可與《憲法》相抵觸"],"ci":1,"core":true,"refs":[5],"law":"C","negative":false,"id":130},{"art":"第六條、第七條","chapter":"第一章　總綱","q":"哪一項正確區分「主體」和「主導力量」？","ev":"國家在社會主義初級階段堅持公有制為主體、多種所有制經濟共同發展。","type":"mc","opts":["集體所有制是主體，國有經濟是主導力量","國有經濟是主體，非公有制經濟是主導力量","公有制是主體，國有經濟是國民經濟的主導力量","非公有制經濟是主體，公有制經濟是主導力量"],"ci":2,"refs":[6,7],"law":"C","negative":false,"id":131},{"art":"第六條、第八條","chapter":"第一章　總綱","q":"全民所有制和勞動群眾集體所有制，合稱哪一種生產資料所有制？","ev":"第六條列明公有制的兩種形式。第八條列舉城鄉合作經濟，說明集體所有制的例子。","type":"sa","ans":"社會主義公有制。","refs":[6,8],"law":"C","negative":false,"id":132},{"art":"第九條、第十條","chapter":"第一章　總綱","q":"下列哪一項明文屬於集體所有？","ev":"城市的土地屬於國家所有，宅基地、自留地和自留山屬於集體所有。","type":"mc","opts":["農村宅基地","礦藏","水流","城市的土地"],"ci":0,"refs":[9,10],"law":"C","negative":false,"id":133},{"art":"第十條、第十三條","chapter":"第一章　總綱","q":"國家為公共利益依法徵收或徵用土地、公民的私有財產時，還須採取甚麼措施？","ev":"兩條分別規範土地及公民私有財產的徵收、徵用，均明定須依法辦理並給予補償。","type":"sa","ans":"給予補償。","refs":[10,13],"law":"C","negative":false,"id":134},{"art":"第十一條、第十五條","chapter":"第一章　總綱","q":"在法律規定範圍內，個體經濟、私營經濟在社會主義市場經濟中有甚麼地位？","ev":"第十一條界定非公有制經濟的地位，第十五條確立國家實行社會主義市場經濟。","type":"mc","opts":["唯一經濟形式","重要組成部分","國民經濟的主導力量","生產資料公有制的兩種形式"],"ci":1,"refs":[11,15],"law":"C","negative":false,"id":135},{"art":"第十二條、第十三條","chapter":"第一章　總綱","q":"哪一項正確概括《憲法》對公民私有財產的保障？","ev":"第十二條保障公共財產，第十三條另行保障合法私有財產並列出依法徵收、徵用的條件。","type":"mc","opts":["只有勞動所得的財產才可繼承","只有集體財產受保護，個人財產須由單位保管","公民合法的私有財產不受侵犯，繼承權依法受保護","私有財產一律不得因公共利益而依法徵用"],"ci":2,"refs":[12,13],"law":"C","negative":false,"id":136},{"art":"第十四條、第二十一條","chapter":"第一章　總綱","q":"國家發展醫療衞生事業以保護人民健康。所建立的社會保障制度須與哪一項因素相適應？","ev":"第十四條把社會保障與經濟發展水平相連，第二十一條要求發展現代醫藥和我國傳統醫藥，以保護人民健康。","type":"mc","opts":["行政區數量","城市人口比例","經濟發展水平","人口平均年齡"],"ci":2,"refs":[14,21],"law":"C","negative":false,"id":137},{"art":"第十六條、第十七條","chapter":"第一章　總綱","q":"國有企業通過職工代表大會等形式，集體經濟組織依法選舉和罷免管理人員。兩者共同實行哪項管理原則？","ev":"兩條分別規定國有企業和集體經濟組織的經營自主權，以及實行民主管理的方式。","type":"sa","ans":"民主管理。","refs":[16,17],"law":"C","negative":false,"id":138},{"art":"第十八條、第三十二條","chapter":"第一章　總綱","q":"外國人在中國境內投資或居住，哪一項符合《憲法》？","ev":"第十八條處理外國投資和經濟合作，第三十二條規定境內外國人合法權益受保護並須遵守中國法律。","type":"mc","opts":["須取得中國國籍才受中國法律保護","其經濟活動一律依原籍國法律監管","只有與國有企業合作時才須遵守中國法律","合法權益受保護，並須遵守中國法律"],"ci":3,"refs":[18,32],"law":"C","negative":false,"id":139},{"art":"第十九條","chapter":"第一章　總綱","q":"國家推廣哪一種全國通用的語言？","ev":"第十九條在教育事業的規定中明確提出推廣普通話；第四條亦保障各民族使用和發展自己語言文字的自由。","type":"sa","ans":"普通話。","refs":[19],"law":"C","negative":false,"id":140},{"art":"第二十條、第二十三條","chapter":"第一章　總綱","q":"為推動科學和現代化建設，國家除了獎勵科學研究成果和技術發明創造，還須培養哪類人才？","ev":"第二十條強調科學研究和知識普及，第二十三條強調培養專業人才和發揮知識分子的作用。","type":"sa","ans":"為社會主義服務的各種專業人才。","refs":[20,23],"law":"C","negative":false,"id":141},{"art":"第二十二條、第二十六條","chapter":"第一章　總綱","q":"保護珍貴文物和防治環境污染，是否均屬《憲法》明文規定的國家職責？","ev":"第二十二條規定保護重要歷史文化遺產，第二十六條規定保護環境和防治污染。","type":"mc","opts":["只有保護珍貴文物","只有防治環境污染","兩項均只由地方自行決定","兩項均是"],"ci":3,"refs":[22,26],"law":"C","negative":false,"id":142},{"art":"第二十四條","chapter":"第一章　總綱","q":"有同學把憲法列出的「愛祖國、愛人民、愛勞動、愛科學、愛社會主義」稱為五項公德。該條還明言國家倡導甚麼價值觀？","ev":"第二十四條規定國家倡導社會主義核心價值觀，並以教育等途徑加強社會主義精神文明建設。","type":"sa","ans":"社會主義核心價值觀。","refs":[24],"law":"C","negative":false,"id":143},{"art":"第二十五條、第四十九條","chapter":"第一章　總綱","q":"條文把計劃生育分別訂為國家推行的政策和誰的義務？","ev":"第二十五條從人口與經濟社會發展的關係訂明國家政策；第四十九條就夫妻雙方訂明義務。","type":"mc","opts":["僅妻子一方","僅丈夫一方","只有國家工作人員","夫妻雙方"],"ci":3,"refs":[25,49],"law":"C","negative":false,"id":144},{"art":"第二十七條","chapter":"第一章　總綱","q":"國家工作人員就職時，應依法公開進行哪項宣誓？","ev":"第二十七條要求依法公開宣誓，並規定國家機關和國家工作人員應傾聽人民意見，接受人民監督。","type":"sa","ans":"憲法宣誓。","refs":[27],"law":"C","negative":false,"id":145},{"art":"第二十八條","chapter":"第一章　總綱","q":"國家維護社會秩序的職責，是否包括處理叛國及其他危害國家安全的犯罪活動？","ev":"這一條亦規定國家制裁危害社會治安、破壞社會主義經濟及其他犯罪活動。","type":"sa","ans":"包括。第二十八條明定國家鎮壓叛國和其他危害國家安全的犯罪活動。","refs":[28],"law":"C","negative":false,"id":146},{"art":"第二十九條","chapter":"第一章　總綱","q":"依《憲法》規定，中華人民共和國的武裝力量屬於誰？","ev":"第二十九條亦列明鞏固國防、抵抗侵略、保衛祖國等任務。","type":"sa","ans":"人民。","refs":[29],"law":"C","negative":false,"id":147},{"art":"第三十條","chapter":"第一章　總綱","q":"自治區、自治州、自治縣、民族鄉之中，哪一項不屬於憲法所稱的「民族自治地方」？","ev":"第三十條列出的民族自治地方共三級，分別為自治區、自治州和自治縣。","type":"mc","opts":["自治區","自治州","民族鄉","自治縣"],"ci":2,"core":true,"refs":[30],"law":"C","negative":true,"id":148},{"art":"第三十一條、第六十二條","chapter":"第一章　總綱","q":"哪條憲法條文明確容許國家在必要時設立特別行政區？由哪個機關以法律規定其制度？","ev":"第三十一條是設立特別行政區的憲法依據。第六十二條將決定特別行政區的設立及其制度列為全國人大的職權。","type":"sa","ans":"第三十一條，全國人民代表大會。","core":true,"refs":[31,62],"law":"C","negative":false,"id":149},{"art":"第三十三條","chapter":"第二章　公民的基本權利和義務","q":"判斷一人是否中華人民共和國公民，《憲法》採用甚麼準則？","ev":"國籍是公民身分的判準，年齡是判斷部分權利行使資格時才涉及的條件。","type":"mc","opts":["是否長期居住中國境內","是否具有中華人民共和國國籍","父母是否均在中國出生","是否已滿十八周歲"],"ci":1,"core":true,"refs":[33],"law":"C","negative":false,"id":150},{"art":"第三十三條","chapter":"第二章　公民的基本權利和義務","q":"「國家＿＿和＿＿人權。」按第三十三條填上兩個動詞。","ev":"同一條亦確立公民在法律面前一律平等，並說明權利與義務並存。","type":"sa","ans":"尊重、保障。","refs":[33],"law":"C","negative":false,"id":151},{"art":"第三十四條","chapter":"第二章　公民的基本權利和義務","q":"年滿多少周歲的中國公民有選舉權和被選舉權？該條明列哪項例外？","ev":"第三十四條並未以財產、教育程度或居住期限作為選舉資格。","type":"sa","ans":"年滿十八周歲。依照法律被剝奪政治權利的人除外。","core":true,"refs":[34],"law":"C","negative":false,"id":152},{"art":"第三十五條、第三十六條","chapter":"第二章　公民的基本權利和義務","q":"以下哪一項屬於第三十六條保障的自由，而非第三十五條列出的六項自由？","ev":"第三十五條列出言論、出版、集會、結社、遊行和示威自由；第三十六條另行保障宗教信仰自由。","type":"mc","opts":["宗教信仰自由","結社自由","集會自由","出版自由"],"ci":0,"refs":[35,36],"law":"C","negative":false,"id":153},{"art":"第三十七條","chapter":"第二章　公民的基本權利和義務","q":"逮捕公民，須經人民檢察院批准或決定，或由人民法院決定。由哪一機關執行？","ev":"第三十七條分別規定批准、決定和執行逮捕的機關，以保障人身自由。","type":"mc","opts":["人民法院","公安機關","人民檢察院","監察委員會"],"ci":1,"core":true,"refs":[37],"law":"C","negative":false,"id":154},{"art":"第三十八條、第三十九條","chapter":"第二章　公民的基本權利和義務","q":"有人誹謗他人，另有人非法侵入他人居所。兩種行為分別涉及哪兩項憲法保障？","ev":"第三十八條禁止侮辱、誹謗等侵害人格尊嚴的行為，第三十九條禁止非法搜查或非法侵入住宅。","type":"sa","ans":"人格尊嚴、住宅不受侵犯。","refs":[38,39],"law":"C","negative":false,"id":155},{"art":"第四十條","chapter":"第二章　公民的基本權利和義務","q":"因國家安全或追查刑事犯罪需要，哪兩類機關可依法定程序檢查通信？","ev":"第四十條一般保障通信自由和通信秘密，並限定檢查的目的、機關和程序。","type":"mc","opts":["公安機關和審計機關","審判機關和監察機關","審計機關和檢察機關","公安機關和檢察機關"],"ci":3,"refs":[40],"law":"C","negative":false,"id":156},{"art":"第四十一條","chapter":"第二章　公民的基本權利和義務","q":"公民發現國家工作人員違法失職，可向有關國家機關採取甚麼行動？試舉兩項。","ev":"有關國家機關必須查清事實並負責處理。公民不得捏造或歪曲事實進行誣告陷害。","type":"sa","ans":"申訴、控告、檢舉，任答兩項。","refs":[41],"law":"C","negative":false,"id":157},{"art":"第四十二條、第四十六條","chapter":"第二章　公民的基本權利和義務","q":"哪一組事項均被《憲法》明文列為公民的權利和義務？","ev":"第四十二條規定公民有勞動的權利和義務，第四十六條就受教育作同樣規定。","type":"mc","opts":["勞動、受教育","勞動、休息","受教育、宗教信仰","休息、納稅"],"ci":0,"core":true,"refs":[42,46],"law":"C","negative":false,"id":158},{"art":"第四十三條、第四十四條、第四十五條","chapter":"第二章　公民的基本權利和義務","q":"哪一項正確配對勞動者、退休人員及公民可獲得的保障？","ev":"第四十三至四十五條依次保障休息、退休生活和物質幫助。公民在年老、疾病或者喪失勞動能力時，有權從國家和社會獲得物質幫助。","type":"mc","opts":["勞動者只在退休後有休息權，退休人員生活由單位自行決定，公民年老時有權獲得物質幫助","勞動者有休息權，退休人員只可依靠家庭，公民只在年老時才可獲得物質幫助","勞動者有休息權，退休人員生活受保障，公民年老時有權獲得物質幫助","勞動者有休息權，退休人員生活受保障，公民患病時一概不能獲得物質幫助"],"ci":2,"refs":[43,44,45],"law":"C","negative":false,"id":159},{"art":"第四十七條、第四十八條","chapter":"第二章　公民的基本權利和義務","q":"一位女研究員進行科學研究，並要求男女同工同酬。兩項訴求分別對應哪兩方面的憲法保障？","ev":"第四十七條保障科學研究自由；第四十八條保障男女平等，並明文規定同工同酬。","type":"sa","ans":"科學研究自由和男女平等權利。","refs":[47,48],"law":"C","negative":false,"id":160},{"art":"第四十九條","chapter":"第二章　公民的基本權利和義務","q":"父母有撫養教育未成年子女的義務。成年子女對父母負有甚麼義務？","ev":"第四十九條分別規定父母對未成年子女，以及成年子女對父母的義務。","type":"sa","ans":"贍養扶助父母。","refs":[49],"law":"C","negative":false,"id":161},{"art":"第五十條","chapter":"第二章　公民的基本權利和義務","q":"《憲法》如何表述對華僑、歸僑和僑眷權益的保障？","ev":"第五十條分別用「正當」及「合法」表述對兩組人士權益的保障。","type":"mc","opts":["只保護具有內地戶籍的華僑","只保護歸僑的財產權益","保護華僑的正當權益，以及歸僑和僑眷的合法權益","只保護僑眷的繼承權"],"ci":2,"refs":[50],"law":"C","negative":false,"id":162},{"art":"第五十一條","chapter":"第二章　公民的基本權利和義務","q":"公民行使自由和權利時，除了國家、社會及集體的利益，還不得損害甚麼？","ev":"第五十一條同時兼顧公共利益與其他公民的自由和權利。","type":"sa","ans":"其他公民合法的自由和權利。","refs":[51],"law":"C","negative":false,"id":163},{"art":"第五十二條、第五十三條、第五十四條","chapter":"第二章　公民的基本權利和義務","q":"哪一項不是第五十二至五十四條列出的公民義務？","ev":"三條分別涵蓋統一與民族團結、守法與公共秩序、祖國安全等義務。集會屬公民自由。","type":"mc","opts":["參與每次公開集會","維護國家統一和全國各民族團結","保守國家秘密","維護祖國的安全、榮譽和利益"],"ci":0,"refs":[52,53,54],"law":"C","negative":true,"id":164},{"art":"第五十五條","chapter":"第二章　公民的基本權利和義務","q":"《憲法》把哪兩項與國防有關的行為並列為公民的「光榮義務」？","ev":"第五十五條先把保衛祖國、抵抗侵略列為公民的神聖職責，再明列服兵役及參加民兵組織的義務。","type":"sa","ans":"依照法律服兵役和參加民兵組織。","refs":[55],"law":"C","negative":false,"id":165},{"art":"第五十六條","chapter":"第二章　公民的基本權利和義務","q":"公民對國家稅收負有甚麼憲法義務？","ev":"第五十六條直接規定公民的納稅義務，並指明應「依照法律」履行。","type":"sa","ans":"依照法律納稅。","refs":[56],"law":"C","negative":false,"id":166},{"art":"第五十七條、第六十九條","chapter":"第三章　國家機構","q":"全國人大常委會是誰的常設機關，又須向誰負責並報告工作？","ev":"全國人大是最高國家權力機關。其常委會為常設機關，向全國人大負責並報告工作。","type":"sa","ans":"兩者都是全國人民代表大會。","core":true,"refs":[57,69],"law":"C","negative":false,"id":167},{"art":"第五十八條","chapter":"第三章　國家機構","q":"哪兩個機關行使國家立法權？","ev":"第五十八條將國家立法權授予這兩個機關，國務院的職權則包括制定行政法規。","type":"sa","ans":"全國人民代表大會及其常務委員會。","refs":[58],"law":"C","negative":false,"id":168},{"art":"第五十九條","chapter":"第三章　國家機構","q":"除省、自治區、直轄市和特別行政區外，全國人大還包括哪方面選出的代表？","ev":"第五十九條將軍隊與四類行政區並列，又規定各少數民族都應有適當名額的代表。","type":"mc","opts":["全國政協","軍隊","國務院","最高人民法院"],"ci":1,"core":true,"refs":[59],"law":"C","negative":false,"id":169},{"art":"第六十條、第六十一條","chapter":"第三章　國家機構","q":"一般情況下，全國人大每屆任期多久？全國人大會議多久舉行一次？","ev":"任期計算一屆代表履職的時間，會期則涉及全國人大會議的召開頻率。","type":"sa","ans":"每屆五年，每年舉行一次會議。","refs":[60,61],"law":"C","negative":false,"id":170},{"art":"第六十一條","chapter":"第三章　國家機構","q":"全國人大常委會召集全國人大會議後，由誰主持大會會議？","ev":"第六十一條把召集與主持分開規定。常委會召集，大會選舉主席團主持。","type":"mc","opts":["全國人大常委會秘書長","國務院總理","國家主席","會議選舉的主席團"],"ci":3,"core":true,"refs":[61],"law":"C","negative":false,"id":171},{"art":"第六十二條、第六十七條","chapter":"第三章　國家機構","q":"哪一項正確配對了「修改憲法」和「解釋憲法」的機關？","ev":"第六十二條和第六十七條分別列出兩個機關的職權。兩者均有監督憲法實施的職權。","type":"mc","opts":["全國人大常委會修改，全國人大解釋","全國人大修改，國務院解釋","全國人大修改，全國人大常委會解釋","國務院修改，全國人大常委會解釋"],"ci":2,"refs":[62,67],"law":"C","negative":false,"id":172},{"art":"第六十二條、第八十條","chapter":"第三章　國家機構","q":"依《憲法》所定程序，國務院總理由誰提名、誰決定人選、誰任命？","ev":"第六十二條規定提名和決定人選的程序，第八十條規定國家主席根據決定任命。","type":"sa","ans":"國家主席提名，全國人大決定人選，國家主席任命。","core":true,"refs":[62,80],"law":"C","negative":false,"id":173},{"art":"第六十二條、第六十三條","chapter":"第三章　國家機構","q":"哪項職位的人選須由全國人大選舉產生，並可由全國人大罷免？","ev":"全國人大對四者均有罷免權，只有最高人民法院院長是由全國人大選舉產生，其他三者按提名決定人選。","type":"mc","opts":["最高人民法院院長","國務院總理","國務院秘書長","審計長"],"ci":0,"refs":[62,63],"law":"C","negative":false,"id":174},{"art":"第六十二條、第八十九條","chapter":"第三章　國家機構","q":"國家預算的「編制和執行」與「審查和批准」，分別屬於誰的職權？","ev":"國務院履行行政職能，負責編制和執行；全國人大審查和批准預算及其執行情況報告。","type":"mc","opts":["全國人大編制和執行，國務院審查和批准","國務院編制和執行，國家主席審查和批准","國務院編制和執行，全國人大審查和批准","全國人大常委會編制和執行，國務院審查和批准"],"ci":2,"refs":[62,89],"law":"C","negative":false,"id":175},{"art":"第六十四條","chapter":"第三章　國家機構","q":"修憲除了可由全國人大常委會提議，還可由最少多少比例的全國人大代表提議？","ev":"第六十四條將提議門檻定為五分之一以上代表，與表決通過修憲的門檻不同。","type":"mc","opts":["四分之一","三分之一","三分之二","五分之一"],"ci":3,"core":true,"refs":[64],"law":"C","negative":false,"id":176},{"art":"第六十四條","chapter":"第三章　國家機構","q":"全國人大表決修憲案和一般法律案時，分別須達到甚麼票數？","ev":"兩項門檻均以全體代表為計算基礎。一般法律案恰好取得半數票仍未過半。","type":"sa","ans":"修憲須全體代表三分之二以上通過，一般法律案須全體代表過半數通過。","refs":[64],"law":"C","negative":false,"id":177},{"art":"第六十五條、第六十六條","chapter":"第三章　國家機構","q":"全國人大常委會中，哪兩類成員連續任職不得超過兩屆？","ev":"第六十五條列明常委會的組成，第六十六條把連任限制適用於委員長和副委員長。","type":"mc","opts":["委員長、秘書長","委員長、副委員長","副委員長、委員","秘書長、委員"],"ci":1,"refs":[65,66],"law":"C","negative":false,"id":178},{"art":"第六十七條、第八十條","chapter":"第三章　國家機構","q":"下列哪一組能正確分辨特赦的「決定者」與「發令者」？","ev":"全國人大常委會決定特赦；國家主席根據決定發佈特赦令。","type":"mc","opts":["國務院決定，國家主席發佈特赦令","國家主席決定，全國人大常委會發佈特赦令","全國人大常委會決定，國家主席發佈特赦令","最高人民法院決定，國務院發佈特赦令"],"ci":2,"refs":[67,80],"law":"C","negative":false,"id":179},{"art":"第六十八條","chapter":"第三章　國家機構","q":"誰主持全國人大常委會的工作，並召集其會議？","ev":"副委員長及秘書長協助委員長工作，三者組成委員長會議。","type":"sa","ans":"全國人大常委會委員長。","core":true,"refs":[68],"law":"C","negative":false,"id":180},{"art":"第七十條、第七十一條","chapter":"第三章　國家機構","q":"「民族委員會」和全國人大為調查特定問題而組織的委員會，分別屬於甚麼類型？","ev":"第七十條列出全國人大的專門委員會。第七十一條規定全國人大或其常委會必要時可就特定問題組織調查委員會。","type":"sa","ans":"專門委員會、調查委員會。","refs":[70,71],"law":"C","negative":false,"id":181},{"art":"第七十二條、第七十三條","chapter":"第三章　國家機構","q":"全國人大代表在大會開會期間，要求國務院某部依法作出答覆，應提出甚麼？","ev":"第七十三條規定質詢案及答覆責任。第七十二條另規定代表可依法提出屬於全國人大職權範圍的議案。","type":"mc","opts":["特赦令","行政規章","調查報告","質詢案"],"ci":3,"refs":[72,73],"law":"C","negative":false,"id":182},{"art":"第七十四條、第七十五條","chapter":"第三章　國家機構","q":"全國人大代表的哪一項行為，依法不受法律追究？","ev":"第七十五條的保障限定於全國人大會議。第七十四條就逮捕或者刑事審判另外設有許可程序。","type":"mc","opts":["在全國人大各種會議上的發言和表決","在私人聚會上的一切發言","任何職務外的經濟活動","所有會議以外的表決"],"ci":0,"refs":[74,75],"law":"C","negative":false,"id":183},{"art":"第七十六條、第七十七條","chapter":"第三章　國家機構","q":"全國人大代表受哪一單位監督？該單位可否依法罷免自己選出的代表？","ev":"代表須與原選舉單位和人民保持密切聯繫，原選舉單位依法有監督及罷免權。","type":"sa","ans":"受原選舉單位監督。該單位可依法罷免本單位選出的代表。","refs":[76,77],"law":"C","negative":false,"id":184},{"art":"第七十八條","chapter":"第三章　國家機構","q":"全國人大及其常委會的組織和工作程序，依《憲法》須由甚麼規定？","ev":"第七十八條把組織和工作程序交由法律規定。","type":"mc","opts":["國務院部門規章","法律","地方性法規","地方政府命令"],"ci":1,"refs":[78],"law":"C","negative":false,"id":185},{"art":"第七十九條","chapter":"第三章　國家機構","q":"要被選為國家主席或副主席，合資格的中國公民至少須年滿多少周歲？","ev":"候選人還須有選舉權及被選舉權；主席、副主席由全國人大選舉。","type":"mc","opts":["三十五周歲","四十五周歲","四十周歲","五十周歲"],"ci":1,"refs":[79],"law":"C","negative":false,"id":186},{"art":"第八十一條、第八十二條","chapter":"第三章　國家機構","q":"誰代表中華人民共和國接受外國使節？國家副主席可在甚麼條件下代行主席的部分職權？","ev":"第八十一條規定主席的國事活動，第八十二條規定副主席協助主席及受託代行部分職權。","type":"sa","ans":"國家主席接受外國使節；副主席受主席委託時可代行部分職權。","refs":[81,82],"law":"C","negative":false,"id":187},{"art":"第八十三條","chapter":"第三章　國家機構","q":"國家主席、副主席行使職權，直至甚麼時候？","ev":"第八十三條以繼任者就職為職權交接的時間。","type":"sa","ans":"下屆全國人大選出的主席、副主席就職為止。","refs":[83],"law":"C","negative":false,"id":188},{"art":"第八十四條","chapter":"第三章　國家機構","q":"國家主席及副主席同時缺位，在全國人大補選前，誰暫時代理主席職位？","ev":"若只有主席缺位，由副主席繼任；兩者同時缺位，才適用暫時代理和補選安排。","type":"mc","opts":["國務院總理","全國政協主席","全國人大常委會委員長","中央軍委副主席"],"ci":2,"core":true,"refs":[84],"law":"C","negative":false,"id":189},{"art":"第八十五條","chapter":"第三章　國家機構","q":"依《憲法》規定，「中央人民政府」是指哪個機關？","ev":"國務院是最高國家權力機關的執行機關，也是最高國家行政機關。","type":"mc","opts":["全國人大","國務院","全國人大常委會","中央軍事委員會"],"ci":1,"core":true,"refs":[85],"law":"C","negative":false,"id":190},{"art":"第八十六條、第八十八條","chapter":"第三章　國家機構","q":"國務院實行哪種負責制？誰召集和主持國務院常務會議？","ev":"兩條分別確立總理負責制，以及總理領導工作和主持會議的職責。","type":"sa","ans":"總理負責制，由國務院總理召集和主持。","refs":[86,88],"law":"C","negative":false,"id":191},{"art":"第八十七條","chapter":"第三章　國家機構","q":"《憲法》明確規定國務院哪三類人員連續任職不得超過兩屆？","ev":"第八十七條先規定國務院每屆任期與全國人大相同，再列出受連任限制的三類人員。","type":"sa","ans":"總理、副總理、國務委員。","refs":[87],"law":"C","negative":false,"id":192},{"art":"第八十九條、第九十條","chapter":"第三章　國家機構","q":"依《憲法》，行政法規與國務院各部門在權限內發佈的規章，分別由誰制定或發佈？","ev":"第八十九條授權國務院制定行政法規。第九十條要求部門規章以法律及國務院的行政法規、決定、命令為依據。","type":"sa","ans":"國務院制定行政法規，各部和各委員會發佈部門規章。","refs":[89,90],"law":"C","negative":false,"id":193},{"art":"第九十一條、第一百零九條","chapter":"第三章　國家機構","q":"中央及地方審計機關均依法獨立行使審計監督權。中央審計機關由誰領導？地方審計機關向哪兩方面負責？","ev":"第九十一條規範中央審計機關，第一百零九條規定縣級以上地方政府設審計機關，並明定其問責關係。","type":"sa","ans":"中央審計機關由國務院總理領導。地方審計機關向本級人民政府和上一級審計機關負責。","refs":[91,109],"law":"C","negative":false,"id":194},{"art":"第九十二條","chapter":"第三章　國家機構","q":"在全國人大閉會期間，國務院向誰負責並報告工作？","ev":"國務院向全國人大負責並報告工作，閉會期間則向其常設機關負責並報告。","type":"mc","opts":["國家主席","全國政協","國家監察委員會","全國人大常委會"],"ci":3,"refs":[92],"law":"C","negative":false,"id":195},{"art":"第九十三條、第九十四條","chapter":"第三章　國家機構","q":"哪個機關領導全國武裝力量？該機關實行哪項負責制？","ev":"中央軍委主席對全國人大和全國人大常委會負責。","type":"sa","ans":"中央軍事委員會，實行主席負責制。","refs":[93,94],"law":"C","negative":false,"id":196},{"art":"第九十五條、第九十六條、第一百零五條","chapter":"第三章　國家機構","q":"縣人民代表大會和縣人民政府，哪一個是地方國家權力機關？哪一個是地方國家行政機關？","ev":"縣設人大和人民政府。地方人民政府也是同級國家權力機關的執行機關。","type":"sa","ans":"縣人大是地方國家權力機關，縣政府是地方國家行政機關。","refs":[95,96,105],"law":"C","negative":false,"id":197},{"art":"第九十七條","chapter":"第三章　國家機構","q":"下列哪一級的人民代表大會代表由選民直接選舉？","ev":"縣、不設區的市、市轄區、鄉、民族鄉、鎮的人大代表由選民直接選舉。","type":"mc","opts":["縣","省","直轄市","設區的市"],"ci":0,"core":true,"refs":[97],"law":"C","negative":false,"id":198},{"art":"第九十八條、第一百零六條","chapter":"第三章　國家機構","q":"一屆縣人民代表大會任期多久？同級人民政府的任期與它有何關係？","ev":"第九十八條訂明地方各級人大任期，第一百零六條據此規定地方政府任期。","type":"sa","ans":"五年，同級人民政府的每屆任期與同級人大相同。","refs":[98,106],"law":"C","negative":false,"id":199},{"art":"第九十九條、第一百零一條","chapter":"第三章　國家機構","q":"依《憲法》，誰審查和批准本縣的預算，並有權選舉和罷免縣長？","ev":"縣級以上地方人大審查和批准本行政區域的預算，地方各級人大選舉並有權罷免同級政府首長。","type":"mc","opts":["縣人民政府","上一級人民政府","縣人民代表大會","縣人民法院"],"ci":2,"refs":[99,101],"law":"C","negative":false,"id":200},{"art":"第一百條","chapter":"第三章　國家機構","q":"設區的市依法制定地方性法規後，一般須報哪個機關批准才可施行？","ev":"設區的市所制定的地方性法規須報批。省、直轄市的人大或其常委會制定地方性法規，則報全國人大常委會備案。","type":"mc","opts":["所在地的省人民政府","全國人大常委會","國務院常務會議","所在省或自治區的人大常委會"],"ci":3,"refs":[100],"law":"C","negative":false,"id":201},{"art":"第一百零二條","chapter":"第三章　國家機構","q":"縣人大代表由選民直接選舉。依法有權監督並罷免該代表的是誰？","ev":"第一百零二條依選舉方式區分監督主體，選舉單位或選民可依法罷免自己選出的代表。","type":"sa","ans":"選出該代表的選民。","refs":[102],"law":"C","negative":false,"id":202},{"art":"第一百零三條、第一百零四條","chapter":"第三章　國家機構","q":"縣人大閉會期間，哪一個常設機關可監督本級人民政府、監察委員會、人民法院和人民檢察院的工作？","ev":"縣人大常委會向縣人大負責並報告工作，對同級「一府一委兩院」履行監督職責。","type":"mc","opts":["縣人大常委會","縣政府常務會議","縣人民檢察院","上級人大主席團"],"ci":0,"refs":[103,104],"law":"C","negative":false,"id":203},{"art":"第一百零七條","chapter":"第三章　國家機構","q":"如要決定某省內一個鎮的建置及區域劃分，按《憲法》由誰決定？","ev":"第一百零七條規定，省、直轄市人民政府決定鄉、民族鄉和鎮的建置及區域劃分。","type":"mc","opts":["省人民政府","鎮人民代表大會","縣人民政府","全國人大常委會"],"ci":0,"refs":[107],"law":"C","negative":false,"id":204},{"art":"第一百零八條、第一百一十條","chapter":"第三章　國家機構","q":"地方各級人民政府除向本級人大負責外，還向哪一級行政機關負責？全國地方政府由誰統一領導？","ev":"縣級以上地方政府領導下級政府的工作。地方各級政府都須服從國務院。","type":"sa","ans":"向上一級國家行政機關負責，由國務院統一領導。","refs":[108,110],"law":"C","negative":false,"id":205},{"art":"第一百一十一條","chapter":"第三章　國家機構","q":"城市的居民委員會和農村的村民委員會，屬於哪一類組織？","ev":"兩類委員會都按居住地區設立，主任、副主任和委員由居民選舉。","type":"mc","opts":["地方國家行政機關","基層群眾性自治組織","地方國家權力機關","民族自治地方的自治機關"],"ci":1,"refs":[111],"law":"C","negative":false,"id":206},{"art":"第一百一十二條、第一百一十五條","chapter":"第三章　國家機構","q":"民族自治地方的自治機關包括哪兩類機關？","ev":"這些自治機關同時行使地方國家機關的職權和法律規定的自治權。","type":"sa","ans":"自治區、自治州、自治縣的人民代表大會和人民政府。","refs":[112,115],"law":"C","negative":false,"id":207},{"art":"第一百一十三條、第一百一十四條","chapter":"第三章　國家機構","q":"自治區主席必須由誰擔任？","ev":"第一百一十四條規定自治區主席的民族身分；第一百一十三條另訂人大常委會主任或副主任的民族代表要求。","type":"mc","opts":["實行區域自治的民族的公民","任一少數民族的公民","本自治區任何一名人大代表","本自治區人大常委會主任"],"ci":0,"refs":[113,114],"law":"C","negative":false,"id":208},{"art":"第一百一十六條","chapter":"第三章　國家機構","q":"自治區人大制定的自治條例須經哪個機關批准方生效？","ev":"自治區的條例報全國人大常委會批准；自治州、自治縣的條例則報省或自治區人大常委會批准，並報全國人大常委會備案。","type":"mc","opts":["國務院","全國人大常委會","自治區人大常委會","國家民族事務委員會"],"ci":1,"refs":[116],"law":"C","negative":false,"id":209},{"art":"第一百一十七條、第一百一十八條、第一百一十九條","chapter":"第三章　國家機構","q":"民族自治地方有管理財政、經濟及文化事業的自治權。下列哪一項說法正確？","ev":"三條分別規定自治機關在地方財政、地方經濟建設和教育文化等事業的權限。","type":"mc","opts":["自治機關一律將地方財政收入交其他省份分配","地方經濟建設不受國家計劃指導","屬於自治地方的財政收入由自治機關自主安排使用","地方教育及文化事業一律由國務院直接管理"],"ci":2,"core":true,"refs":[117,118,119],"law":"C","negative":false,"id":210},{"art":"第一百二十條","chapter":"第三章　國家機構","q":"民族自治地方需要組織維護本地方社會治安的公安部隊，須經哪個機關批准？","ev":"第一百二十條列出三項條件，包括符合國家的軍事制度、當地有實際需要及經國務院批准。","type":"mc","opts":["國家監察委員會","最高人民檢察院","自治地方人大常委會","國務院"],"ci":3,"refs":[120],"law":"C","negative":false,"id":211},{"art":"第一百二十一條","chapter":"第三章　國家機構","q":"民族自治地方的自治機關執行職務時，可依據自治條例使用甚麼語言文字？","ev":"第一百二十一條同時限定使用的依據和語言文字的範圍。","type":"sa","ans":"當地通用的一種或幾種語言文字。","refs":[121],"law":"C","negative":false,"id":212},{"art":"第一百二十二條","chapter":"第三章　國家機構","q":"國家透過哪些資源幫助各少數民族加速經濟和文化建設？試舉條文明列的兩方面。","ev":"第一百二十二條亦要求協助民族自治地方從當地民族中培養幹部、專業人才及技術工人。","type":"sa","ans":"財政、物資、技術，任答兩項。","refs":[122],"law":"C","negative":false,"id":213},{"art":"第一百二十三條、第一百二十五條","chapter":"第三章　國家機構","q":"國家的最高監察機關是甚麼？它與地方各級監察委員會有何工作關係？","ev":"各級監察委員會是國家的監察機關，上級監察委員會領導下級監察委員會的工作。","type":"sa","ans":"國家監察委員會，領導地方各級監察委員會的工作。","refs":[123,125],"law":"C","negative":false,"id":214},{"art":"第一百二十四條、第一百二十九條、第一百三十五條","chapter":"第三章　國家機構","q":"哪一組職務均有「連續任職不得超過兩屆」的明文規定？","ev":"三條分別對最高監察、審判、檢察機關的首長列明連任限制。","type":"mc","opts":["國家主席、國家副主席、國家監察委員會主任","中央軍委主席、國務院總理、最高人民法院院長","國家副主席、中央軍委主席、最高人民檢察院檢察長","國家監察委員會主任、最高人民法院院長、最高人民檢察院檢察長"],"ci":3,"refs":[124,129,135],"law":"C","negative":false,"id":215},{"art":"第一百二十六條、第一百二十七條","chapter":"第三章　國家機構","q":"地方監察委員會依法獨立行使監察權，同時須向哪兩方面負責？","ev":"第一百二十六條規定負責對象，第一百二十七條保障依法獨立行使監察權。","type":"sa","ans":"產生它的國家權力機關，以及上一級監察委員會。","refs":[126,127],"law":"C","negative":false,"id":216},{"art":"第一百二十八條、第一百三十一條、第一百三十四條、第一百三十六條","chapter":"第三章　國家機構","q":"「依法獨立行使審判權」與「依法獨立行使檢察權」分別對應哪一類機關？","ev":"人民法院是國家的審判機關；人民檢察院是國家的法律監督機關。兩者依法獨立行使各自職權。","type":"sa","ans":"人民法院、人民檢察院。","core":true,"refs":[128,131,134,136],"law":"C","negative":false,"id":217},{"art":"第一百三十條","chapter":"第三章　國家機構","q":"人民法院審理案件原則上是否公開？被告人享有哪項明文保障？","ev":"第一百三十條同時規定公開審理的原則、例外以及辯護權。","type":"sa","ans":"除法律規定的特別情況外，一律公開審理；被告人有權獲得辯護。","refs":[130],"law":"C","negative":false,"id":218},{"art":"第一百三十二條、第一百三十七條","chapter":"第三章　國家機構","q":"比較上級法院與上級檢察院的職能，哪一項用詞符合《憲法》？","ev":"法院系統的條文用「監督」，檢察院系統的條文用「領導」。","type":"mc","opts":["上級法院領導下級法院的審判工作，上級檢察院監督下級檢察院的工作","上級法院監督下級法院的審判工作，上級檢察院領導下級檢察院的工作","兩者均稱為領導","兩者均稱為監督"],"ci":1,"refs":[132,137],"law":"C","negative":false,"id":219},{"art":"第一百三十三條、第一百三十八條","chapter":"第三章　國家機構","q":"最高人民法院和最高人民檢察院都對哪兩個機關負責？","ev":"兩條分別規定最高審判機關和最高檢察機關的負責對象。","type":"sa","ans":"全國人民代表大會及其常務委員會。","refs":[133,138],"law":"C","negative":false,"id":220},{"art":"第一百三十九條","chapter":"第三章　國家機構","q":"訴訟參與人不通曉當地通用的語言文字，人民法院和人民檢察院應如何處理？","ev":"第一百三十九條保障各民族公民使用本民族語言文字進行訴訟的權利。","type":"sa","ans":"應當為他們翻譯。","refs":[139],"law":"C","negative":false,"id":221},{"art":"第一百四十條","chapter":"第三章　國家機構","q":"人民法院、人民檢察院和公安機關辦理刑事案件時，應遵循哪三項要求？","ev":"第一百四十條列出三者辦理刑事案件的關係，目的是保證法律得到準確有效的執行。","type":"sa","ans":"分工負責、互相配合、互相制約。","refs":[140],"law":"C","negative":false,"id":222},{"art":"第一百四十一條","chapter":"第四章　國旗、國歌、國徽、首都","q":"請說出我國的國旗和國歌名稱。","ev":"第一百四十一條同時規定國旗和國歌。","type":"sa","ans":"國旗是五星紅旗，國歌是《義勇軍進行曲》。","core":true,"refs":[141],"law":"C","negative":false,"id":223},{"art":"第一百四十二條","chapter":"第四章　國旗、國歌、國徽、首都","q":"我國國徽中間是五星照耀下的天安門，周圍是哪兩種圖案？","ev":"第一百四十二條分別描述國徽中間和周圍的圖案。","type":"mc","opts":["穀穗和齒輪","紫荊花和齒輪","穀穗和長城","松枝和長城"],"ci":0,"core":true,"refs":[142],"law":"C","negative":false,"id":224},{"art":"第一百四十三條","chapter":"第四章　國旗、國歌、國徽、首都","q":"《憲法》第一百四十三條規定，中華人民共和國的首都是哪個城市？","ev":"首都載於《憲法》第四章的最後一條。","type":"sa","ans":"北京。","refs":[143],"law":"C","negative":false,"id":225},{"art":"通過日期及公布文件","chapter":"第一章　總則","q":"2020年6月30日，哪個機關通過《香港國安法》？","ev":"第十三屆全國人大常委會第二十次會議通過《香港國安法》。同日，該法列入《基本法》附件三，由香港在當地公布實施。","core":true,"type":"mc","opts":["全國人民代表大會","香港特別行政區立法會","國務院","全國人民代表大會常務委員會"],"ci":3,"additional":[{"title":"憲報附表","body":"2020年6月30日第十三屆全國人民代表大會常務委員會第二十次會議通過"}],"refs":[],"law":"N","negative":false,"id":226},{"art":"第一條","type":"sa","q":"《香港國安法》要防範、制止和懲治哪四類危害國家安全的犯罪？","ev":"第三章以四節分別規定這四類罪行。作答時，「勾結」一項須指出境外因素及危害國家安全。","chapter":"第一章　總則","ans":"分裂國家、顛覆國家政權、恐怖活動、勾結外國或者境外勢力危害國家安全。","core":true,"refs":[1],"law":"N","negative":false,"id":227},{"art":"第二條","type":"mc","q":"《香港國安法》指出，《基本法》哪兩條是關於香港特區法律地位的根本性條款？","ev":"第一條確立香港是中國不可分離的部分，第十二條確立香港是直轄於中央人民政府、享有高度自治權的地方行政區域。","chapter":"第一章　總則","opts":["第一條和第十二條","第十八條和第二十三條","第二條和第五條","第十三條和第十四條"],"ci":0,"core":true,"refs":[2],"law":"N","negative":false,"id":228},{"art":"第三條","type":"sa","q":"中央人民政府和香港特區對維護香港國家安全分別負有甚麼責任？","ev":"第三條區分中央和特區的責任，並要求特區行政、立法和司法機關依法履行職責。","chapter":"第一章　總則","ans":"中央人民政府負有根本責任，香港特區負有憲制責任。","core":true,"refs":[3],"law":"N","negative":false,"id":229},{"art":"第四條","type":"sa","q":"維護國家安全時應尊重和保障人權。除《基本法》外，第四條還提到哪兩份國際公約適用於香港的有關規定？","ev":"第四條列舉依法保護的權利和自由，包括言論、新聞、出版及集會自由。","chapter":"第一章　總則","ans":"《公民權利和政治權利國際公約》和《經濟、社會與文化權利的國際公約》。","refs":[4],"law":"N","negative":false,"id":230},{"art":"第五條","type":"mc","q":"被告人已經司法程序就某一行為被最終宣告無罪。就同一行為，《香港國安法》訂明哪項保障？","ev":"第五條保障已經司法程序最終判定有罪或宣告無罪的人，同條亦保障無罪推定和辯護權。","chapter":"第一章　總則","opts":["可不經審判直接處罰","不得再予審判或者懲罰","只可再審一次","須改由另一法院重審"],"ci":1,"core":true,"refs":[5],"law":"N","negative":false,"id":231},{"art":"第六條","type":"sa","q":"香港居民參選或就任公職時，須依法簽署文件確認或宣誓哪兩項承諾？","ev":"「擁護」的對象是《基本法》，「效忠」的對象是香港特區。","chapter":"第一章　總則","ans":"擁護《基本法》，效忠中華人民共和國香港特別行政區。","refs":[6],"law":"N","negative":false,"id":232},{"art":"第七條、第八條","type":"mc","q":"《香港國安法》如何處理《基本法》規定的香港維護國家安全立法責任？","ev":"第七條重申香港的立法責任，第八條要求執法及司法機關切實執行《香港國安法》及相關現行法律。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["只須完成立法，毋須執行現行法律","以年度報告代替本地立法","將立法責任轉交警務處","要求香港儘早完成有關立法，完善相關法律"],"ci":3,"refs":[7,8],"law":"N","negative":false,"id":233},{"art":"第九條、第十條","type":"sa","q":"香港通過學校、社會團體、媒體及網絡開展國家安全教育，旨在提高居民哪兩方面的意識？","ev":"第九條要求加強宣傳、指導、監督和管理，第十條進一步訂明教育途徑及目標。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","ans":"國家安全意識和守法意識。","refs":[9,10],"law":"N","negative":false,"id":234},{"art":"第十一條","type":"sa","q":"誰須就香港履行維護國家安全職責的情況提交年度報告？報告交給誰？","ev":"中央人民政府提出要求時，行政長官亦須就特定事項及時提交報告。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","ans":"行政長官向中央人民政府提交。","refs":[11],"law":"N","negative":false,"id":235},{"art":"第十二條、第十三條","type":"mc","q":"香港特別行政區維護國家安全委員會由誰擔任主席？","ev":"該委員會承擔特區維護國家安全的主要責任，接受中央人民政府的監督和問責。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["政務司司長","保安局局長","駐港國家安全公署署長","行政長官"],"ci":3,"core":true,"refs":[12,13],"law":"N","negative":false,"id":236},{"art":"第十四條","type":"mc","q":"以下哪一項不是香港特區維護國家安全委員會的職責？","ev":"委員會負責規劃、制度建設和協調，律政司的專門部門負責檢控。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["代表控方提出刑事檢控","推進國安法律制度和執行機制建設","制定香港特區維護國家安全政策","協調維護國家安全的重點工作和重大行動"],"ci":0,"refs":[14],"law":"N","negative":true,"id":237},{"art":"第十四條","type":"mc","q":"關於香港特區維護國家安全委員會的工作和決定，哪項敘述正確？","ev":"第十四條另訂明，委員會的工作不受特區任何其他機構、組織和個人干涉。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["會議必須公開，決定須由行政會議確認","工作信息不予公開，決定不受司法覆核","工作信息不予公開，決定須由立法會通過","會議必須公開，決定不受司法覆核"],"ci":1,"refs":[14],"law":"N","negative":false,"id":238},{"art":"第十五條","type":"sa","q":"誰指派香港特區維護國家安全委員會的國家安全事務顧問？顧問以何種身分參與會議？","ev":"顧問就委員會履行職責提供意見。委員會主席由行政長官擔任。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","ans":"中央人民政府指派，顧問列席會議。","refs":[15],"law":"N","negative":false,"id":239},{"art":"第十六條至第十八條","type":"mc","q":"香港特區內負責調查和檢控危害國家安全犯罪案件的專門部門，分別設在哪裏？","ev":"警務處的專責部門蒐集情報和調查案件，律政司的專責部門處理檢控及相關法律事務。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["調查部門設於入境事務處，檢控部門設於保安局","調查部門設於警務處，檢控部門設於律政司","調查部門設於律政司，檢控部門設於警務處","調查部門設於保安局，檢控部門設於行政長官辦公室"],"ci":1,"core":true,"refs":[16,17,18],"law":"N","negative":false,"id":240},{"art":"第十九條","type":"mc","q":"財政司司長須每年向哪個機構報告香港維護國家安全專門款項的控制和管理情況？","ev":"經行政長官批准，財政司司長從政府一般收入撥款，再每年向立法會報告款項的控制及管理情況。","chapter":"第二章　香港特別行政區維護國家安全的職責和機構","opts":["立法會","終審法院","駐港國家安全公署","行政會議"],"ci":0,"refs":[19],"law":"N","negative":false,"id":241},{"art":"第二十條","type":"mc","q":"某人策劃將香港從中國分離出去，旨在分裂國家。他沒有使用武力，也沒有以武力相威脅。按第二十條，哪項判斷正確？","ev":"第二十條涵蓋組織、策劃、實施或參與實施所列行為，並訂明不論是否使用或威脅使用武力。","chapter":"第三章　罪行和處罰","opts":["必須獲境外資助才可構成分裂國家罪","必須使用武力才可構成分裂國家罪","必須已成功分離領土才可構成分裂國家罪","單憑沒有使用或威脅使用武力，不能排除構成分裂國家罪"],"ci":3,"core":true,"refs":[20],"law":"N","negative":false,"id":242},{"art":"第二十條、第二十二條","type":"sa","q":"分裂國家罪與顛覆國家政權罪的首要分子或罪行重大者，可處甚麼刑罰？","ev":"兩條對這一級別訂下相同刑罰。「十年以上」是有期徒刑的下限。","chapter":"第三章　罪行和處罰","ans":"無期徒刑或者十年以上有期徒刑。","refs":[20,22],"law":"N","negative":false,"id":243},{"art":"第二十一條、第二十三條","type":"mc","q":"某人用金錢資助他人實施第二十條規定的分裂國家犯罪。以下哪項正確？","ev":"第二十一條列明煽動、協助、教唆及資助的行為。第二十三條對資助他人實施顛覆國家政權犯罪有相應規定。","chapter":"第三章　罪行和處罰","opts":["必須親自參與武力行動才屬犯罪","只有資助者屬組織首領才屬犯罪","只有資金來自境外才屬犯罪","資助行為本身已列為犯罪"],"ci":3,"refs":[21,23],"law":"N","negative":false,"id":244},{"art":"第二十二條","type":"mc","q":"某人旨在顛覆國家政權，以其他非法手段嚴重阻撓香港特區政權機關依法履行職能。這直接對應哪一罪名？","ev":"第二十二條涵蓋武力、威脅使用武力或其他非法手段。嚴重阻撓政權機關依法履職是該條列舉的行為之一。","chapter":"第三章　罪行和處罰","opts":["恐怖活動罪","勾結外國或者境外勢力危害國家安全罪","分裂國家罪","顛覆國家政權罪"],"ci":3,"core":true,"refs":[22],"law":"N","negative":false,"id":245},{"art":"第二十四條","type":"mc","q":"第二十四條規定，恐怖活動須造成或意圖造成嚴重社會危害，並具有哪項目的？","ev":"該條指中央人民政府、香港特區政府或國際組織。答題須同時辨認脅迫或威嚇的對象，以及實現政治主張的目的。","chapter":"第三章　罪行和處罰","opts":["為掩飾個人身分而逃避債務","為實現政治主張而脅迫有關政府或國際組織，或者威嚇公眾","為獲商業利益而排擠競爭對手","為向僱主索償而破壞公司財物"],"ci":1,"core":true,"refs":[24],"law":"N","negative":false,"id":246},{"art":"第二十五條","type":"sa","q":"按《香港國安法》，一個組織有意圖實施第二十四條所指的恐怖活動罪行，但未實際發動襲擊，可否落入「恐怖活動組織」的定義？","ev":"該定義亦涵蓋已實施、參與或協助實施有關罪行的組織。","chapter":"第三章　罪行和處罰","ans":"可以。第二十五條的定義包括意圖實施該類罪行的組織。","refs":[25],"law":"N","negative":false,"id":247},{"art":"第二十六條至第二十八條","type":"mc","q":"以下哪項行為由《香港國安法》第二十七條直接列為犯罪？","ev":"第二十七條針對宣揚恐怖主義及煽動實施恐怖活動。提供資金、領導組織及題述破壞行為分別見第二十六、二十五及二十四條。第二十八條保留按本地法律處理其他形式恐怖活動犯罪的安排。","chapter":"第三章　罪行和處罰","opts":["領導恐怖活動組織","宣揚恐怖主義","破壞交通設施以威嚇公眾、實現政治主張並造成嚴重社會危害","為恐怖活動提供資金"],"ci":1,"refs":[26,27,28],"law":"N","negative":false,"id":248},{"art":"第二十九條","type":"mc","q":"某人請求境外組織對香港特區實施封鎖，直接對應哪一類《香港國安法》罪行？","ev":"第二十九條列明，請求境外機構、組織或人員對香港特區或中國進行制裁、封鎖或採取其他敵對行動，屬該條規管的情形。","chapter":"第三章　罪行和處罰","opts":["分裂國家罪","勾結外國或者境外勢力危害國家安全罪","恐怖活動罪","顛覆國家政權罪"],"ci":1,"core":true,"refs":[29],"law":"N","negative":false,"id":249},{"art":"第二十九條","type":"mc","q":"為境外機構從事以下哪項行為，直接符合第二十九條關於國家秘密或情報的規定？","ev":"該條針對為外國或境外機構、組織、人員竊取、刺探、收買或非法提供涉及國家安全的國家秘密或情報。","chapter":"第三章　罪行和處罰","opts":["翻譯已刊憲的法例","整理公開的博物館展覽資料","轉載已發表的天文觀測數據","竊取涉及國家安全的國家秘密"],"ci":3,"refs":[29],"law":"N","negative":false,"id":250},{"art":"第三十條","type":"mc","q":"為實施第二十條或第二十二條的犯罪而與境外組織串謀，第三十條訂明應如何處罰？","ev":"第三十條同時涵蓋為實施上述犯罪而直接或間接接受境外指使、控制、資助或其他支援。","chapter":"第三章　罪行和處罰","opts":["一律只按恐怖活動罪定罪","一律只向境外組織判處罰金","依相關的分裂國家罪或顛覆國家政權罪條文從重處罰","一律改為行政處分"],"ci":2,"refs":[30],"law":"N","negative":false,"id":251},{"art":"第三十一條、第三十二條","type":"mc","q":"一間公司犯《香港國安法》所訂罪行，第三十一條明文規定對該組織判處甚麼？","ev":"對組織判處罰金，並應責令其暫停運作或吊銷執照或營業許可證。另依第三十二條追繳、沒收違法所得及用於或意圖用於犯罪的資金和工具。","chapter":"第三章　罪行和處罰","opts":["罰金","社會服務令","驅逐出境","有期徒刑"],"ci":0,"refs":[31,32],"law":"N","negative":false,"id":252},{"art":"第三十三條","type":"mc","q":"以下哪一項不是第三十三條列明可從輕或減輕處罰的情形？","ev":"條文列明自動中止、投案如實供述及揭發犯罪等情形。即使符合條件，亦是「可以」從輕或減輕處罰。","chapter":"第三章　罪行和處罰","opts":["自動投案並如實供述自己的罪行","揭發他人犯罪且查證屬實","僅表示願意道歉","在犯罪過程中自動放棄犯罪"],"ci":2,"refs":[33],"law":"N","negative":true,"id":253},{"art":"第三十四條","type":"mc","q":"第三十四條規定的驅逐出境措施，適用對象以哪項身分條件區分？","ev":"條文以是否具有香港永久性居民身分為準。對該類人士實施本法規定的犯罪，可獨立或附加適用驅逐出境。","chapter":"第三章　罪行和處罰","opts":["不具有香港特區永久性居民身分","未在香港出生","未曾在香港就業","不持有香港特區護照"],"ci":0,"refs":[34],"law":"N","negative":false,"id":254},{"art":"第三十五條","type":"mc","q":"根據第三十五條，在哪一階段，當事人即喪失作為候選人參加香港立法會或區議會選舉的資格？","ev":"觸發點是法院判決有罪。條文亦涉及出任公職及行政長官選舉委員會委員的資格。","chapter":"第三章　罪行和處罰","opts":["被警方拘捕","被警方邀請協助調查","經法院判決犯危害國家安全罪行","被正式提出檢控"],"ci":2,"refs":[35],"law":"N","negative":false,"id":255},{"art":"第三十六條","type":"sa","q":"犯罪行為在香港以外發生，結果在香港境內發生。按第三十六條，是否視為在香港境內犯罪？","ev":"同條亦把在香港註冊的船舶或航空器內實施的本法罪行納入適用範圍。","chapter":"第三章　罪行和處罰","ans":"是。行為或結果有一項發生在香港境內便符合該條規定。","refs":[36],"law":"N","negative":false,"id":256},{"art":"第三十七條、第三十八條","type":"mc","q":"某人並非香港永久性居民，在香港以外實施《香港國安法》規定的犯罪。第三十八條所指的犯罪須針對哪裏？","ev":"第三十八條明訂須針對香港特區。第三十七條則另就香港永久性居民和在香港成立的組織在境外犯本法罪行作出規定。","chapter":"第三章　罪行和處罰","opts":["香港特別行政區","犯罪工具的註冊地","犯事者居住地","提供資金者的出生地"],"ci":0,"refs":[37,38],"law":"N","negative":false,"id":257},{"art":"第三十九條","type":"sa","q":"某行為在《香港國安法》施行前已全部完成，可否依第三十九條按本法將該行為定罪處刑？","ev":"須看行為發生的時間。調查或檢控日期在施行之後，並不改變已完成行為的日期。","chapter":"第三章　罪行和處罰","ans":"不可。按本法定罪處刑的規定適用於本法施行以後的行為。","core":true,"refs":[39],"law":"N","negative":false,"id":258},{"art":"第四十條","type":"mc","q":"除第五十五條規定的例外情形外，誰對《香港國安法》規定的犯罪案件行使管轄權？","ev":"第四十條把管轄權一般交予香港特區，第五十五條另訂駐港國家安全公署管轄的條件和批准程序。","chapter":"第四章　案件管轄、法律適用和程序","opts":["駐港國家安全公署","中央人民政府駐港聯絡辦公室","最高人民檢察院","香港特別行政區"],"ci":3,"core":true,"refs":[40],"law":"N","negative":false,"id":259},{"art":"第四十一條","type":"sa","q":"就香港特區管轄的危害國家安全犯罪案件提出檢控，須先取得誰的甚麼形式同意？","ev":"此項規定針對提出檢控，並不影響依法逮捕、羈押或嫌疑人申請保釋。","chapter":"第四章　案件管轄、法律適用和程序","ans":"律政司司長的書面同意。","refs":[41],"law":"N","negative":false,"id":260},{"art":"第四十一條","type":"mc","q":"香港審理危害國家安全案件時，因涉及國家秘密而禁止公眾旁聽部分程序。以下哪項仍須公開？","ev":"第四十一條訂明審判應公開進行，特定情況下可限制旁聽，但判決結果一律公開宣佈。","chapter":"第四章　案件管轄、法律適用和程序","opts":["所有證人身分","全部證據材料","全部審理程序紀錄","判決結果"],"ci":3,"refs":[41],"law":"N","negative":false,"id":261},{"art":"第四十二條","type":"sa","q":"在危害國家安全案件中，法官須對哪件事有充足理由相信，才可按第四十二條准予保釋？","ev":"這是第四十二條訂明的保釋門檻。單憑被告願意交出旅遊證件，不能取代法官對該項條件的判斷。","chapter":"第四章　案件管轄、法律適用和程序","ans":"犯罪嫌疑人或被告人不會繼續實施危害國家安全的行為。","refs":[42],"law":"N","negative":false,"id":262},{"art":"第四十三條","type":"mc","q":"警務處國安部門擬對有合理理由懷疑涉及實施危害國家安全犯罪的人員截取通訊。按第四十三條第六項，須經誰批准？","ev":"同一項亦涵蓋秘密監察。特區維護國家安全委員會對執法機構採取第四十三條所列措施負監督責任。","chapter":"第四章　案件管轄、法律適用和程序","opts":["財政司司長","律政司司長","行政長官","警務處處長"],"ci":2,"refs":[43],"law":"N","negative":false,"id":263},{"art":"第四十四條、第四十五條","type":"sa","q":"誰負責指定處理危害國家安全犯罪案件的法官？每次指定的任期多久？","ev":"行政長官可先徵詢特區維護國家安全委員會和終審法院首席法官的意見。各級法院由該級的指定法官處理有關案件。除本法另有規定外，刑事檢控程序按香港其他法律處理。","chapter":"第四章　案件管轄、法律適用和程序","ans":"行政長官指定，任期一年。","refs":[44,45],"law":"N","negative":false,"id":264},{"art":"第四十六條","type":"mc","q":"在高等法院原訟法庭，律政司司長依法發出證書指示毋須陪審團。審判庭由多少名法官組成？","ev":"條文列出的發證理由包括保護國家秘密、案件具有涉外因素，或保障陪審員及其家人的人身安全。","chapter":"第四章　案件管轄、法律適用和程序","opts":["兩名","三名","一名","五名"],"ci":1,"refs":[46],"law":"N","negative":false,"id":265},{"art":"第四十七條","type":"sa","q":"法院審理案件時，遇到證據材料是否涉及國家秘密的認定問題，須取得誰的證明書？其效力如何？","ev":"同一規定也適用於法院須認定有關行為是否涉及國家安全的情形。","chapter":"第四章　案件管轄、法律適用和程序","ans":"行政長官的證明書，對法院有約束力。","refs":[47],"law":"N","negative":false,"id":266},{"art":"第四十八條、第四十九條","type":"mc","q":"駐港國家安全公署是由哪一方設立的機構？","ev":"公署由中央人民政府設立，其職責包括監督、指導、協調及支持特區履職，並依法辦理危害國家安全犯罪案件。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","opts":["香港特區維護國家安全委員會","香港警務處","中央人民政府","香港律政司"],"ci":2,"refs":[48,49],"law":"N","negative":false,"id":267},{"art":"第五十條、第六十條","type":"sa","q":"駐港國家安全公署人員須遵守哪些法律？第六十條所指不受香港特區管轄的，是他們的哪類行為？","ev":"第五十條訂明守法及依法接受監督的要求。第六十條所述的行為有「依據本法執行職務」的限定。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","ans":"須遵守全國性法律和香港特區法律。依《香港國安法》執行職務的行為不受香港特區管轄。","refs":[50,60],"law":"N","negative":false,"id":268},{"art":"第五十一條","type":"mc","q":"駐港國家安全公署的經費由誰保障？","ev":"第五十一條規管中央駐港公署的經費。第十九條的特區政府專門款項另有撥款及報告安排。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","opts":["香港警務處專項基金","香港政府一般收入","中央財政","香港立法會秘書處預算"],"ci":2,"refs":[51],"law":"N","negative":false,"id":269},{"art":"第五十二條、第五十三條","type":"mc","q":"駐港國家安全公署須與哪個香港特區機構建立協調機制，以監督、指導香港維護國家安全工作？","ev":"第五十三條專指與特區國安委的協調機制。第五十二條另訂公署與中聯辦、外交部駐港特派員公署及駐港部隊的工作聯繫。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","opts":["香港特區維護國家安全委員會","香港金融管理局","立法會秘書處","行政會議秘書處"],"ci":0,"refs":[52,53],"law":"N","negative":false,"id":270},{"art":"第五十四條","type":"sa","q":"就境外非政府組織及新聞機構在港的管理和服務，哪兩個中央駐港機構會同特區政府採取必要措施？","ev":"第五十四條亦涵蓋外國和國際組織駐港機構。「會同」特區政府表示三方均參與。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","ans":"駐港國家安全公署和外交部駐港特派員公署。","refs":[54],"law":"N","negative":false,"id":271},{"art":"第五十五條","type":"sa","q":"出現第五十五條所列情形之一時，哪些機構有權提出由駐港國家安全公署管轄案件？由誰批准？","ev":"其中一方提出即可，仍須經中央人民政府批准，公署才按該條行使管轄權。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","ans":"香港特區政府或駐港國家安全公署均可提出，須報中央人民政府批准。","core":true,"refs":[55],"law":"N","negative":false,"id":272},{"art":"第五十五條","type":"mc","q":"下列哪一項不是第五十五條列明由駐港國家安全公署管轄案件的情形？","ev":"條文列明三種情形。傳媒報道本身並非其中一種。即使符合所列情形，仍須履行提出及報請批准的程序。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","opts":["案件涉及境外勢力介入的複雜情況，香港特區管轄確有困難","國家安全面臨重大現實威脅","案件受到多間海外傳媒報道","香港特區政府出現無法有效執行本法的嚴重情況"],"ci":2,"refs":[55],"law":"N","negative":true,"id":273},{"art":"第五十六條、第五十七條","type":"sa","q":"在第五十五條管轄的案件中，誰負責立案偵查？誰指定行使審判權的法院？","ev":"最高人民檢察院另指定檢察機關行使檢察權。有關訴訟程序適用《中華人民共和國刑事訴訟法》等相關法律。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","ans":"駐港國家安全公署立案偵查，最高人民法院指定有關法院。","refs":[56,57],"law":"N","negative":false,"id":274},{"art":"第五十八條、第五十九條","type":"mc","q":"在第五十五條管轄的案件中，嫌疑人何時起有權委託律師作為辯護人？","ev":"第五十八條訂明委託律師的起點及儘早接受公正審判的權利。第五十九條則要求知悉有關案情者如實作證。","chapter":"第五章　中央人民政府駐香港特別行政區維護國家安全機構","opts":["待法院第一次開庭後","待起訴書正式送達後","自被駐港國家安全公署第一次訊問或採取強制措施之日起","待一審宣判後"],"ci":2,"refs":[58,59],"l
